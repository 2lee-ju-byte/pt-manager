/* ── 공통 UI 빌더 */
const INP={width:"100%",padding:"11px 14px",background:T.surface,border:`1.5px solid ${T.border2}`,borderRadius:"10px",color:T.text,fontSize:"14px",outline:"none",transition:"border-color .15s"};

function el(tag,style={},html=""){const e=document.createElement(tag);Object.assign(e.style,style);if(html)e.innerHTML=html;return e;}
function inp(attrs={},sx={}){const i=document.createElement("input");Object.assign(i.style,INP,sx);Object.entries(attrs).forEach(([k,v])=>i.setAttribute(k,v));i.addEventListener("focus",()=>i.style.borderColor=T.accent);i.addEventListener("blur",()=>i.style.borderColor=T.border2);return i;}
function sel(options,val="",sx={}){const s=document.createElement("select");Object.assign(s.style,{...INP,...sx});options.forEach(o=>{const op=document.createElement("option");op.value=o.v||o;op.textContent=o.l||o;if((o.v||o)===val)op.selected=true;s.appendChild(op);});return s;}
function ta(ph="",sx={}){const t=document.createElement("textarea");Object.assign(t.style,{...INP,minHeight:"80px",resize:"vertical",...sx});t.placeholder=ph;return t;}

function btn(text,onClick,v="dark",sz="md",sx={}){
  const sizes={sm:{padding:"6px 14px",fontSize:"12px"},md:{padding:"10px 20px",fontSize:"14px"},lg:{padding:"13px 26px",fontSize:"15px"}};
  const vars={
    dark:{background:T.accent,color:"#fff",border:"none"},
    light:{background:T.surface,color:T.text,border:`1.5px solid ${T.border2}`},
    ghost:{background:T.surface2,color:T.text2,border:`1.5px solid ${T.border}`},
    danger:{background:"transparent",color:T.red,border:`1.5px solid #fca5a5`},
    success:{background:T.greenBg,color:T.green,border:`1.5px solid #86efac`},
  };
  const b=document.createElement("button");
  Object.assign(b.style,{display:"inline-flex",alignItems:"center",justifyContent:"center",gap:"6px",cursor:"pointer",fontWeight:"600",borderRadius:"10px",transition:"all .15s",fontFamily:"'Noto Sans KR',sans-serif",...vars[v],...sizes[sz],...sx});
  b.innerHTML=text;
  b.addEventListener("click",onClick);
  b.addEventListener("mouseenter",()=>b.style.opacity="0.85");
  b.addEventListener("mouseleave",()=>b.style.opacity="1");
  return b;
}

function card(sx={}){return el("div",{background:T.surface,border:`1.5px solid ${T.border}`,borderRadius:"14px",padding:"20px",...sx});}
function lbl(text){return el("p",{fontSize:"11px",fontWeight:"700",color:T.text3,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"8px"},text);}
function tag(text,color="gray"){
  const colors={gray:{bg:T.surface2,color:T.text3,border:T.border},green:{bg:T.greenBg,color:T.green,border:"#86efac"},red:{bg:T.redBg,color:T.red,border:"#fca5a5"},blue:{bg:T.blueBg,color:T.blue,border:"#93c5fd"}};
  const c=colors[color]||colors.gray;
  const s=el("span",{fontSize:"11px",fontWeight:"600",background:c.bg,color:c.color,border:`1px solid ${c.border}`,borderRadius:"99px",padding:"3px 10px",whiteSpace:"nowrap"});
  s.textContent=text;return s;
}
function bar(val,max,color=T.accent){
  const pct=Math.min(Math.round(val/max*100),100);
  const w=el("div",{background:T.surface3,borderRadius:"99px",height:"6px",overflow:"hidden"});
  w.appendChild(el("div",{width:`${pct}%`,background:color,height:"100%",borderRadius:"99px",transition:"width .7s ease"}));
  return w;
}
function divider(my=16){return el("div",{borderTop:`1.5px solid ${T.border}`,margin:`${my}px 0`});}
function stars(val,onChange,size=20){
  const w=el("div",{display:"flex",gap:"3px"});
  [1,2,3,4,5].forEach(n=>{
    const s=el("span",{fontSize:`${size}px`,cursor:onChange?"pointer":"default",color:n<=val?"#f59e0b":"#e5e7eb",transition:"color .15s"},"★");
    if(onChange)s.addEventListener("click",()=>onChange(n));
    w.appendChild(s);
  });
  return w;
}
function fld(label,sx={}){
  const w=el("div",{marginBottom:"14px",...sx});
  if(label){const l=el("label",{display:"block",fontSize:"12px",fontWeight:"700",color:T.text2,marginBottom:"6px"});l.textContent=label;w.appendChild(l);}
  return w;
}
function modal(title,content,wide=false){
  const ov=el("div",{position:"fixed",inset:"0",background:"rgba(0,0,0,.4)",zIndex:"999",display:"flex",alignItems:"center",justifyContent:"center",padding:"16px"});
  ov.className="ov";
  ov.addEventListener("click",e=>e.target===ov&&ov.remove());
  const box=el("div",{background:T.surface,borderRadius:"18px",padding:"28px",width:"100%",maxWidth:wide?"560px":"460px",maxHeight:"90vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.15)"});
  box.className="a0";
  const hd=el("div",{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"22px"});
  const ttl=el("h3",{fontFamily:"'Noto Serif KR',serif",fontSize:"20px",fontWeight:"700",color:T.text},title);
  const cls=btn("×",()=>ov.remove(),"ghost","sm",{width:"32px",height:"32px",borderRadius:"8px",padding:"0"});
  hd.appendChild(ttl);hd.appendChild(cls);box.appendChild(hd);box.appendChild(content);
  ov.appendChild(box);document.body.appendChild(ov);return ov;
}
function toast(msg,ok=true){
  const t=el("div",{position:"fixed",bottom:"90px",left:"50%",transform:"translateX(-50%)",background:ok?"#111":"#dc2626",color:"#fff",borderRadius:"99px",padding:"10px 20px",fontSize:"13px",fontWeight:"600",zIndex:"9999",whiteSpace:"nowrap",boxShadow:"0 4px 20px rgba(0,0,0,.2)"},msg);

}
function pageHdr(sub,title,action=null){

/* ── Firebase CRUD */
const addDoc2=async(col,data)=>db.collection(col).add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
const updateDoc2=async(col,id,data)=>db.collection(col).doc(id).update(data);
const setDoc2=async(col,id,data)=>db.collection(col).doc(id).set(data,{merge:true});

function loadTrainerData(){
  S.unsubs.forEach(u=>u());S.unsubs=[];
  const tid=uid();
  S.unsubs.push(
    db.collection("members").where("trainerId","==",tid).onSnapshot(snap=>{S.members=snap.docs.map(d=>({id:d.id,...d.data()}));render();}),
    db.collection("logs").where("trainerId","==",tid).onSnapshot(snap=>{S.logs=snap.docs.map(d=>({id:d.id,...d.data()}));render();}),
    db.collection("diets").where("trainerId","==",tid).onSnapshot(snap=>{S.diets=snap.docs.map(d=>({id:d.id,...d.data()}));render();}),
    db.collection("schedules").where("trainerId","==",tid).onSnapshot(snap=>{S.schedules=snap.docs.map(d=>({id:d.id,...d.data()}));render();}),
    db.collection("resources").where("trainerId","==",tid).onSnapshot(snap=>{S.resources=snap.docs.map(d=>({id:d.id,...d.data()}));render();})
  );
}

async function loadMemberData(memberId){
  S.unsubs.forEach(u=>u());S.unsubs=[];
  const me=await db.collection("members").doc(memberId).get();
  if(me.exists)S.members=[{id:me.id,...me.data()}];
  S.unsubs.push(
    db.collection("logs").where("memberId","==",memberId).onSnapshot(snap=>{S.logs=snap.docs.map(d=>({id:d.id,...d.data()}));render();}),
    db.collection("diets").where("memberId","==",memberId).onSnapshot(snap=>{S.diets=snap.docs.map(d=>({id:d.id,...d.data()}));render();}),
    db.collection("schedules").where("memberId","==",memberId).onSnapshot(snap=>{S.schedules=snap.docs.map(d=>({id:d.id,...d.data()}));render();}),
    db.collection("resources").where("trainerId","==",S.members[0]?.trainerId).onSnapshot(snap=>{S.resources=snap.docs.map(d=>({id:d.id,...d.data()}));render();})
  );
}

/* ── 인증 모달 */
function showAuthModal(defaultMode="login"){
  const cnt=el("div",{});
  let mode=defaultMode;

  /* 탭 */
  const tabWrap=el("div",{display:"flex",gap:"8px",marginBottom:"22px"});
  const tabs=[
    {m:"login",l:"트레이너 로그인"},
    {m:"signup",l:"트레이너 가입"},
    {m:"member",l:"회원 입장"},
  ];
  const updateTabs=()=>tabBtns.forEach(({b,m})=>Object.assign(b.style,{background:m===mode?T.accent:T.surface2,color:m===mode?"#fff":T.text2,border:m===mode?"none":`1.5px solid ${T.border}`}));
  const tabBtns=tabs.map(t=>{
    const b=document.createElement("button");
    Object.assign(b.style,{flex:"1",padding:"9px 4px",borderRadius:"10px",border:"none",cursor:"pointer",fontSize:"11px",fontWeight:"700",transition:"all .15s",fontFamily:"'Noto Sans KR',sans-serif"});
    b.textContent=t.l;b.addEventListener("click",()=>{mode=t.m;updateTabs();updateForm();});
    tabWrap.appendChild(b);return{b,m:t.m};
  });
  updateTabs();cnt.appendChild(tabWrap);

  const formArea=el("div",{});cnt.appendChild(formArea);

  /* 로그인 */
  const loginForm=()=>{
    const w=el("div",{});

  const tabs=isT?TRAINER_TABS:MEMBER_TABS;

  if(S.tab==="dash"&&isT)content.appendChild(renderDash());
  else if(S.tab==="members"&&isT)content.appendChild(renderMembers());
  else if(S.tab==="workout")content.appendChild(renderWorkout());
  else if(S.tab==="diet_review"&&isT)content.appendChild(renderDietReview());
  else if(S.tab==="diet"&&!isT)content.appendChild(renderDietMember());
  else if(S.tab==="weight"&&!isT)content.appendChild(renderWeight());

  tabs.forEach(t=>{

    if(S.tab===t.id){const bar=el("div",{position:"absolute",top:"-1px",left:"50%",transform:"translateX(-50%)",width:"20px",height:"2.5px",background:T.accent,borderRadius:"99px"});b.appendChild(bar);}

        ["변화",diff!==null?`${+diff>0?"+":""}${diff}kg`:"—",+diff<0?"green":+diff>0?"red":"gray"],

        cell.appendChild(el("p",{fontSize:"10px",color:T.text3,marginBottom:"4px"},k));

      if(d.trainerComment)fb.appendChild(el("p",{fontSize:"13px",color:T.text2,lineHeight:"1.7"},d.trainerComment));c.appendChild(fb);
    }
    wrap.appendChild(c);
  });
  const addModal=()=>{
    const cnt=el("div",{});const TIMES=["아침","점심","저녁","간식"];
    let meals=[{time:"아침",items:[{food:"",kcal:""}]},{time:"점심",items:[{food:"",kcal:""}]},{time:"저녁",items:[{food:"",kcal:""}]}];
    const grid=el("div",{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"});
    const df=fld("날짜");df.style.gridColumn="1/-1";const di=inp({type:"date",value:today()});df.appendChild(di);
    const wf=fld("수분(L)");const wi=inp({type:"number",step:"0.5",placeholder:"2.0"});wf.appendChild(wi);
    const cf=fld("커피(잔)");const ci=inp({type:"number",placeholder:"1"});cf.appendChild(ci);
    grid.appendChild(df);grid.appendChild(wf);grid.appendChild(cf);cnt.appendChild(grid);cnt.appendChild(divider());
    const aiRow=el("div",{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"});
    aiRow.appendChild(lbl("끼니별 식단"));
    const aiBtn=el("button",{background:T.accent,color:"#fff",border:"none",borderRadius:"9px",padding:"8px 16px",cursor:"pointer",fontSize:"12px",fontWeight:"700",fontFamily:"'Noto Sans KR',sans-serif"},"✦ AI 칼로리 자동계산");
    aiRow.appendChild(aiBtn);cnt.appendChild(aiRow);
    cnt.appendChild(el("p",{fontSize:"11px",color:T.text3,marginBottom:"14px"},"음식명 입력 시 자동으로 kcal이 채워집니다."));
    const mealArea=el("div",{});cnt.appendChild(mealArea);
    const drawMeals=()=>{
      mealArea.innerHTML="";
      meals.forEach((meal,mi)=>{
        const mw=el("div",{marginBottom:"18px"});mw.appendChild(el("p",{fontSize:"13px",fontWeight:"700",color:T.text2,marginBottom:"10px"},`${ICON[meal.time]} ${meal.time}`));
        meal.items.forEach((it,ii)=>{
          const row=el("div",{display:"grid",gridTemplateColumns:"3fr 1fr",gap:"8px",marginBottom:"8px"});
          const fi=inp({type:"text",placeholder:"음식명"},{padding:"10px 12px"});fi.value=it.food;
          const ki=inp({type:"number",placeholder:"kcal"},{padding:"10px",color:it.kcal?T.green:T.text3});ki.value=it.kcal||"";
          fi.addEventListener("input",e=>{const k=findKcal(e.target.value);meals[mi].items[ii].food=e.target.value;if(k!==null){meals[mi].items[ii].kcal=k;ki.value=k;ki.style.color=T.green;}});
          ki.addEventListener("input",e=>meals[mi].items[ii].kcal=+e.target.value);
          row.appendChild(fi);row.appendChild(ki);mw.appendChild(row);
        });
        const ab=el("button",{background:"none",border:"none",color:T.text3,fontSize:"12px",cursor:"pointer",padding:"0",fontFamily:"'Noto Sans KR',sans-serif"},"+ 음식 추가");
        ab.addEventListener("click",()=>{meals[mi].items.push({food:"",kcal:""});drawMeals();});mw.appendChild(ab);mealArea.appendChild(mw);
      });
    };
    drawMeals();
    aiBtn.addEventListener("click",async()=>{
      const foods=meals.flatMap(m=>m.items.map(it=>it.food)).filter(Boolean);
      if(!foods.length){toast("음식을 먼저 입력해주세요",false);return;}
      aiBtn.innerHTML=`<span class="spin">⟳</span> 계산 중...`;
      try{
        const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:500,messages:[{role:"user",content:`다음 음식 1인분 칼로리를 JSON으로만. 키=음식명, 값=정수: ${foods.join(", ")}`}]})});
        const data=await r.json();const raw=data.content?.map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();const parsed=JSON.parse(raw);
        meals.forEach(meal=>meal.items.forEach(it=>{if(!it.food)return;const k=Object.keys(parsed).find(k=>k.includes(it.food)||it.food.includes(k));if(k)it.kcal=parsed[k];}));
        drawMeals();toast("칼로리 계산 완료!");
      }catch{meals.forEach(meal=>meal.items.forEach(it=>{const k=findKcal(it.food);if(k!==null)it.kcal=k;}));drawMeals();}
      aiBtn.innerHTML="✦ AI 칼로리 자동계산";
    });
    const aw=el("div",{display:"flex",gap:"8px",marginBottom:"14px",flexWrap:"wrap"});

    cnt.appendChild(aw);
    const sb=btn("저장하기",async()=>{
      const valid=meals.map(m=>({...m,items:m.items.filter(it=>it.food)})).filter(m=>m.items.length>0);
      if(!valid.length){toast("식단을 입력해주세요",false);return;}
      const total=valid.reduce((a,m)=>a+m.items.reduce((b,it)=>b+(+it.kcal||0),0),0);
      sb.innerHTML=`<span class="spin">⟳</span> 저장 중...`;
      const m=S.members.find(x=>x.id===S.myMemberId);
      try{await addDoc2("diets",{trainerId:m?.trainerId,memberId:S.myMemberId,date:di.value,meals:valid,water:+wi.value,coffee:+ci.value,totalKcal:total,trainerRating:0,trainerComment:""});toast("식단 저장 완료!");document.querySelector(".ov")?.remove();}
      catch(e){toast("오류가 발생했습니다",false);sb.textContent="저장하기";}
    },"dark","lg",{width:"100%"});cnt.appendChild(sb);modal("식단 기록",cnt,true);
  };
  return wrap;
}

      const tl=el("div",{});tl.appendChild(el("p",{fontFamily:"'Noto Serif KR',serif",fontSize:"18px",fontWeight:"700",color:T.text,marginBottom:"2px"},m?.name||""));tl.appendChild(el("p",{fontSize:"12px",color:T.text3},d.date));
      const kc=el("div",{textAlign:"right"});kc.appendChild(el("p",{fontFamily:"'Noto Serif KR',serif",fontSize:"22px",fontWeight:"700",color:T.text},d.totalKcal.toLocaleString()));kc.appendChild(el("p",{fontSize:"10px",color:T.text3,letterSpacing:"0.07em"},"KCAL"));
      top.appendChild(tl);top.appendChild(kc);c.appendChild(top);
      d.meals.forEach(meal=>{const mw=el("div",{marginBottom:"12px"});mw.appendChild(el("p",{fontSize:"11px",color:T.text3,letterSpacing:"0.07em",marginBottom:"8px",fontWeight:"600"},`${ICON[meal.time]||"🍽"} ${meal.time}`));meal.items.forEach(it=>{const row=el("div",{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${T.border}`});row.appendChild(el("span",{fontSize:"14px",color:T.text},it.food));row.appendChild(el("span",{fontSize:"14px",fontWeight:"600",color:T.text2},`${it.kcal}kcal`));mw.appendChild(row);});c.appendChild(mw);});
      c.appendChild(divider(12));
      const tgs=el("div",{display:"flex",gap:"8px",flexWrap:"wrap",marginBottom:"14px"});tgs.appendChild(tag(`💧 ${d.water}L`));tgs.appendChild(tag(`☕ 커피 ${d.coffee}잔`));c.appendChild(tgs);
      c.appendChild(divider(0));
      const ea=el("div",{paddingTop:"14px"});
      if(editId!==d.id){
        const er=el("div",{display:"flex",justifyContent:"space-between",alignItems:"flex-start"});
        const left=el("div",{});
        if(d.trainerRating>0){left.appendChild(stars(d.trainerRating,null,18));if(d.trainerComment)left.appendChild(el("p",{fontSize:"13px",color:T.text2,marginTop:"6px",lineHeight:"1.7",maxWidth:"280px"},d.trainerComment));}
        else left.appendChild(el("p",{fontSize:"12px",color:T.text3},"피드백 미작성"));
        er.appendChild(left);er.appendChild(btn(d.trainerRating>0?"수정":"평가하기",()=>{editId=d.id;draw();},"ghost","sm"));ea.appendChild(er);
      }else{
        let sv=d.trainerRating||0;
        ea.appendChild(el("p",{fontSize:"12px",fontWeight:"700",color:T.text2,marginBottom:"12px"},"식단 평가"));
        const sw=el("div",{marginBottom:"14px"});const drawS=()=>{sw.innerHTML="";sw.appendChild(stars(sv,v=>{sv=v;drawS();},28));};drawS();ea.appendChild(sw);
        const ct=ta("피드백 입력 (예: 단백질 비율 좋음, 탄수화물 조금 늘려보세요)",{marginBottom:"12px"});ct.value=d.trainerComment||"";ea.appendChild(ct);
        const br=el("div",{display:"flex",gap:"8px"});
        const sb=btn("저장",async()=>{sb.innerHTML=`<span class="spin">⟳</span>`;try{await updateDoc2("diets",d.id,{trainerRating:sv,trainerComment:ct.value});editId=null;toast("피드백 저장 완료!");}catch{toast("오류가 발생했습니다",false);}},"dark","md",{flex:"1"});
        br.appendChild(sb);br.appendChild(btn("취소",()=>{editId=null;draw();},"ghost","md"));ea.appendChild(br);
      }
      c.appendChild(ea);wrap.appendChild(c);
    });
  };
  draw();return wrap;
}

/* ── 체중 (회원) */
function renderWeight(){
  const wrap=el("div",{});wrap.appendChild(pageHdr("Weight","체중 기록"));
  const m=S.members.find(x=>x.id===S.myMemberId);
  if(!m){wrap.appendChild(el("p",{color:T.text4},"불러오는 중..."));return wrap;}
  const wLog=m.weightLog||[],w0=wLog[0]?.w,wN=wLog.at(-1)?.w;
  const diff=wLog.length>=2?(wN-w0).toFixed(1):null;
  const c=card({marginBottom:"14px"});c.appendChild(lbl("나의 체중 변화"));
  const grid=el("div",{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginTop:"10px",marginBottom:"18px"});
  [["시작",`${w0}kg`],["현재",`${wLog.at(-1)?.w}kg`],["변화",diff!==null?`${+diff>0?"+":""}${diff}kg`:"—"]].forEach(([k,v])=>{
    const cell=el("div",{background:T.surface2,borderRadius:"10px",padding:"14px 10px",textAlign:"center"});
    cell.appendChild(el("p",{fontSize:"10px",color:T.text3,marginBottom:"6px",fontWeight:"600"},k));
    cell.appendChild(el("p",{fontFamily:"'Noto Serif KR',serif",fontSize:"22px",fontWeight:"700",color:k==="변화"&&diff!==null?(+diff<0?T.green:+diff>0?T.red:T.text):T.text},v));
    grid.appendChild(cell);
  });
  c.appendChild(grid);
  c.appendChild(el("p",{fontSize:"11px",color:T.text3,marginBottom:"10px",fontWeight:"600",letterSpacing:"0.05em"},"기록 내역"));
  [...wLog].reverse().slice(0,8).forEach(entry=>{
    const row=el("div",{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${T.border}`});
    row.appendChild(el("span",{fontSize:"13px",color:T.text2},entry.date));
    row.appendChild(el("span",{fontFamily:"'Noto Serif KR',serif",fontSize:"17px",fontWeight:"600",color:T.text},`${entry.w} kg`));
    c.appendChild(row);
  });
  wrap.appendChild(c);
  const ic=card();ic.appendChild(lbl("오늘 체중 입력"));
  const ir=el("div",{display:"flex",gap:"10px",marginTop:"12px"});
  const wi=inp({type:"number",step:"0.1",placeholder:"예) 59.5"},{flex:"1",fontSize:"20px",textAlign:"center",fontWeight:"700"});
  const sb=btn("저장",async()=>{
    if(!wi.value){toast("체중을 입력해주세요",false);return;}
    const val=+wi.value,td=today();sb.innerHTML=`<span class="spin">⟳</span>`;
    try{const nl=[...(m.weightLog||[]),{date:td,w:val}];await updateDoc2("members",S.myMemberId,{weightLog:nl,weight:val});wi.value="";toast("체중 저장 완료! ✓");}
    catch(e){toast("오류가 발생했습니다",false);}sb.textContent="저장";
  },"dark","md");
  ir.appendChild(wi);ir.appendChild(sb);ic.appendChild(ir);
  ic.appendChild(el("p",{fontSize:"11px",color:T.text3,textAlign:"center",marginTop:"12px"},"입력하면 트레이너가 실시간으로 확인합니다"));
  wrap.appendChild(ic);return wrap;
}

/* ── 일정 */
function renderSchedule(){
  const wrap=el("div",{});const isT=S.role==="trainer";
  wrap.appendChild(pageHdr("Schedule","PT 일정",!isT?null:btn("+ 일정 추가",()=>addModal(),"dark","md")));
  const list=isT?S.schedules:S.schedules.filter(s=>s.memberId===S.myMemberId);
  const upcoming=[...list.filter(s=>s.status==="예정")].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const done=[...list.filter(s=>s.status==="완료")].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const mkRow=(s,can)=>{
    const m=S.members.find(x=>x.id===s.memberId);
    const row=el("div",{display:"flex",alignItems:"center",gap:"12px",padding:"12px 0",borderBottom:`1px solid ${T.border}`});
    const tm=el("div",{background:T.surface2,borderRadius:"10px",padding:"8px 12px",minWidth:"58px",textAlign:"center"});
    tm.appendChild(el("p",{fontFamily:"'Noto Serif KR',serif",fontSize:"16px",fontWeight:"700",color:T.text},s.time));
    tm.appendChild(el("p",{fontSize:"10px",color:T.text3,marginTop:"2px"},s.date.slice(5)));
    const info=el("div",{flex:"1"});info.appendChild(el("p",{fontSize:"15px",fontWeight:"700",color:T.text},m?.name||""));info.appendChild(el("p",{fontSize:"12px",color:T.text3,marginTop:"2px"},`${s.duration}분`));
    row.appendChild(tm);row.appendChild(info);
    if(can)row.appendChild(btn("완료",async()=>{await updateDoc2("schedules",s.id,{status:"완료"});toast("완료 처리!");},  "success","sm"));
    else row.appendChild(tag("완료","green"));
    return row;
  };
  const uc=card({marginBottom:"12px"});const uh=el("div",{display:"flex",justifyContent:"space-between",marginBottom:"14px"});uh.appendChild(lbl("예정된 일정"));uh.appendChild(tag(`${upcoming.length}건`,"blue"));uc.appendChild(uh);
  if(!upcoming.length)uc.appendChild(el("p",{color:T.text4,fontSize:"14px",padding:"14px 0"},"예정된 일정이 없습니다"));
  else upcoming.forEach(s=>uc.appendChild(mkRow(s,isT)));wrap.appendChild(uc);
  const dc=card();const dh=el("div",{display:"flex",justifyContent:"space-between",marginBottom:"14px"});dh.appendChild(lbl("완료된 세션"));dh.appendChild(tag(`${done.length}건`,"green"));dc.appendChild(dh);
  if(!done.length)dc.appendChild(el("p",{color:T.text4,fontSize:"14px",padding:"14px 0"},"완료된 세션이 없습니다"));
  else done.forEach(s=>dc.appendChild(mkRow(s,false)));wrap.appendChild(dc);
  const addModal=()=>{
    const cnt=el("div",{});const mf=fld("회원");const ms=sel([{v:"",l:"회원 선택"},...S.members.map(m=>({v:m.id,l:m.name}))]);mf.appendChild(ms);cnt.appendChild(mf);
    const grid=el("div",{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"});
    const df=fld("날짜");const di=inp({type:"date",value:today()});df.appendChild(di);
    const tf=fld("시간");const ti=inp({type:"time",value:"10:00"});tf.appendChild(ti);
    const duf=fld("세션 시간(분)");const dui=inp({type:"number",value:"60"});duf.appendChild(dui);
    grid.appendChild(df);grid.appendChild(tf);grid.appendChild(duf);cnt.appendChild(grid);
    const sb=btn("일정 추가",async()=>{if(!ms.value){toast("회원을 선택해주세요",false);return;}sb.innerHTML=`<span class="spin">⟳</span>`;try{await addDoc2("schedules",{trainerId:uid(),memberId:ms.value,date:di.value,time:ti.value,duration:+dui.value,status:"예정"});toast("일정 추가 완료!");document.querySelector(".ov")?.remove();}catch(e){toast("오류가 발생했습니다",false);sb.textContent="일정 추가";}  },"dark","lg",{width:"100%"});
    cnt.appendChild(sb);modal("PT 일정 추가",cnt);
  };
  return wrap;
}

/* ── 자료 배포 */
function renderResources(){
  const wrap=el("div",{});const isT=S.role==="trainer";
  wrap.appendChild(pageHdr("Resources","참고 자료",isT?btn("+ 자료 추가",()=>addModal(),"dark","md"):null));

  if(!S.resources.length){
    const empty=el("div",{textAlign:"center",padding:"60px 0"});
    empty.appendChild(el("p",{fontSize:"40px",marginBottom:"12px"},"📚"));
    empty.appendChild(el("p",{fontSize:"15px",fontWeight:"700",color:T.text2,marginBottom:"6px"},isT?"아직 공유된 자료가 없습니다":"트레이너가 자료를 공유하면 여기에 표시됩니다"));
    empty.appendChild(el("p",{fontSize:"13px",color:T.text3},isT?"+ 자료 추가 버튼으로 회원들에게 자료를 배포해보세요":""));
    wrap.appendChild(empty);
  }else{
    const CATS={운동:"🏋️",식단:"🥗",생활습관:"🌟",기타:"📄"};
    S.resources.forEach(r=>{
      const c=card({marginBottom:"12px"});
      const top=el("div",{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"10px"});
      const tl=el("div",{});
      const nm=el("div",{display:"flex",alignItems:"center",gap:"8px",marginBottom:"4px"});
      nm.appendChild(el("span",{fontSize:"20px"},CATS[r.category]||"📄"));
      nm.appendChild(el("span",{fontSize:"16px",fontWeight:"700",color:T.text},r.title));
      tl.appendChild(nm);tl.appendChild(el("p",{fontSize:"12px",color:T.text3},r.date));
      top.appendChild(tl);top.appendChild(tag(r.category||"기타"));c.appendChild(top);
      if(r.description)c.appendChild(el("p",{fontSize:"14px",color:T.text2,lineHeight:"1.7",marginBottom:"12px"},r.description));
      if(r.content){
        const cb=el("div",{background:T.surface2,borderRadius:"10px",padding:"14px",marginBottom:"12px"});
        cb.appendChild(el("p",{fontSize:"13px",color:T.text2,lineHeight:"1.8",whiteSpace:"pre-wrap"},r.content));
        c.appendChild(cb);
      }
      if(r.link){const lb=btn("🔗 링크 열기",()=>window.open(r.link,"_blank"),"light","sm",{marginBottom:"4px"});c.appendChild(lb);}
      if(isT){
        c.appendChild(divider(10));
        c.appendChild(btn("삭제",async()=>{if(confirm("삭제할까요?"))await db.collection("resources").doc(r.id).delete();},"danger","sm"));
      }
      wrap.appendChild(c);
    });
  }
  const addModal=()=>{
    const cnt=el("div",{});
    const tf=fld("자료 제목");const ti=inp({type:"text",placeholder:"예) 3대 운동 자세 가이드"});tf.appendChild(ti);cnt.appendChild(tf);
    const cf=fld("카테고리");const cs=sel(["운동","식단","생활습관","기타"],"운동");cf.appendChild(cs);cnt.appendChild(cf);
    const df=fld("설명 (선택)");const di=inp({type:"text",placeholder:"간단한 설명"});df.appendChild(di);cnt.appendChild(df);
    const ctf=fld("내용");const cta2=ta("자료 내용을 입력하세요\n운동 방법, 식단 가이드 등",{minHeight:"120px"});ctf.appendChild(cta2);cnt.appendChild(ctf);
    const lf=fld("링크 (선택)");const li=inp({type:"url",placeholder:"https://..."});lf.appendChild(li);cnt.appendChild(lf);
    const sb=btn("배포하기",async()=>{
      if(!ti.value.trim()){toast("제목을 입력해주세요",false);return;}
      sb.innerHTML=`<span class="spin">⟳</span> 배포 중...`;
      try{await addDoc2("resources",{trainerId:uid(),title:ti.value.trim(),category:cs.value,description:di.value,content:cta2.value,link:li.value,date:today()});toast("자료 배포 완료!");document.querySelector(".ov")?.remove();}
      catch(e){toast("오류가 발생했습니다",false);sb.textContent="배포하기";}
    },"dark","lg",{width:"100%"});cnt.appendChild(sb);modal("자료 추가",cnt,true);
  };
  return wrap;
}

/* ══════════════════════════════════════
   앱 시작
══════════════════════════════════════ */
auth.onAuthStateChanged(async user=>{
  if(user){
    // 트레이너 계정인지 확인
    const tSnap=await db.collection("trainers").doc(user.uid).get();
    if(tSnap.exists){
      S.role="trainer";S.tab="dash";
      loadTrainerData();render();
    } else {
      // 회원 계정이면 자동 로그아웃 (회원은 직접 로그인 선택)
      await auth.signOut();
      S.role=null;render();
    }
  }else{
    if(S.role!=="member"){S.role=null;render();}
  }
});
