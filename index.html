<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#060606;color:#fff;font-family:'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased;height:100%}
input,select,textarea,button{font-family:'Noto Sans KR',sans-serif}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#222;border-radius:9px}
input::placeholder,textarea::placeholder{color:#2a2a2a}

<div id="app"></div>

<script>
// ── 디자인 토큰
const T={bg:"#060606",surface:"#0e0e0e",surface2:"#141414",surface3:"#1a1a1a",border:"#1e1e1e",border2:"#272727",text:"#ffffff",text2:"#888",text3:"#444",text4:"#2a2a2a",green:"#5ee89a",red:"#f87171"};

// ── 칼로리 DB
const KCAL={닭가슴살:165,현미밥:218,백미밥:300,고구마:131,달걀:78,삶은달걀:78,단백질쉐이크:120,오트밀:370,샐러드:80,연어:208,참치:132,두부:76,브로콜리:34,아보카도:160,바나나:89,사과:52,요거트:100,그릭요거트:59,아몬드:579,견과류:600,우유:61,두유:54,닭볶음탕:180,삼겹살:518,된장찌개:90,김치찌개:75,비빔밥:490,불고기:215,갈비탕:210,삼계탕:250,짜장면:520,짬뽕:450,볶음밥:400,김밥:320,샌드위치:310,식빵:265,떡:350,떡볶이:300,라면:480,우동:400,아메리카노:10,카페라떼:130,카푸치노:110,녹차:2,프로틴바:200,소고기:271,새우:99,고등어:202,계란프라이:90,토스트:265,시리얼:380,치킨:239,피자:266,햄버거:354};
function findKcal(n){if(!n)return null;const s=n.trim().replace(/\s+/g,"").toLowerCase();for(const[k,v]of Object.entries(KCAL))if(s.includes(k)||k.includes(s))return v;return null;}

// ── 앱 상태
let STATE={user:null,role:null,myMemberId:null,tab:"dash",members:[],logs:[],diets:[],schedules:[],unsubs:[],loading:true};
let FB=null;

// ── 유틸
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>FB?.auth?.currentUser?.uid;
const el=id=>document.getElementById(id);
const h=(tag,props={},children=[])=>{const e=document.createElement(tag);Object.entries(props).forEach(([k,v])=>{if(k==="style"&&typeof v==="object")Object.assign(e.style,v);else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);else e.setAttribute(k,v);});(Array.isArray(children)?children:[children]).forEach(c=>{if(c==null)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c);});return e;};

// ── CSS 공용
const INP={width:"100%",padding:"12px 14px",background:T.surface2,border:`1px solid ${T.border2}`,borderRadius:"10px",color:T.text,fontSize:"14px",outline:"none"};
const makeInp=(attrs={},sx={})=>{const i=document.createElement("input");Object.assign(i.style,INP,sx);Object.entries(attrs).forEach(([k,v])=>i.setAttribute(k,v));return i;};
const makeSel=(options,val,sx={})=>{const s=document.createElement("select");Object.assign(s.style,{...INP,...sx});options.forEach(o=>{const op=document.createElement("option");op.value=o.val||o;op.textContent=o.label||o;if((o.val||o)===val)op.selected=true;s.appendChild(op);});return s;};
const makeTa=(ph,sx={})=>{const t=document.createElement("textarea");Object.assign(t.style,{...INP,minHeight:"72px",resize:"vertical",...sx});t.placeholder=ph||"";return t;};

function mkBtn(text,onClick,v="white",sz="md",sx={}){
  const sizes={sm:{padding:"7px 14px",fontSize:"12px"},md:{padding:"11px 22px",fontSize:"14px"},lg:{padding:"15px 26px",fontSize:"15px"}};
  const vars={white:{background:"#fff",color:"#000"},ghost:{background:T.surface2,color:T.text2,border:`1px solid ${T.border2}`},outline:{background:"transparent",color:"#fff",border:`1px solid ${T.border2}`},danger:{background:"transparent",color:T.red,border:`1px solid #3a1515`}};
  const b=document.createElement("button");
  Object.assign(b.style,{display:"inline-flex",alignItems:"center",justifyContent:"center",gap:"6px",border:"none",cursor:"pointer",fontWeight:"600",letterSpacing:"0.02em",transition:"all .15s",borderRadius:"10px",...vars[v],...sizes[sz],...sx});
  b.addEventListener("click",onClick);
  b.innerHTML=text;
  return b;
}

function mkCard(sx={}){const d=document.createElement("div");Object.assign(d.style,{background:T.surface,border:`1px solid ${T.border}`,borderRadius:"16px",padding:"22px",...sx});return d;}

function mkLabel(text){const p=document.createElement("p");Object.assign(p.style,{fontSize:"11px",fontWeight:"600",color:T.text3,letterSpacing:"0.09em",textTransform:"uppercase",marginBottom:"7px"});p.textContent=text;return p;}

function mkTag(text){const s=document.createElement("span");Object.assign(s.style,{fontSize:"11px",color:T.text3,background:T.surface2,border:`1px solid ${T.border2}`,borderRadius:"99px",padding:"3px 10px",fontWeight:"500",whiteSpace:"nowrap"});s.textContent=text;return s;}

function mkBar(val,max,color="#fff"){
  const pct=Math.min(Math.round(val/max*100),100);
  const wrap=document.createElement("div");
  Object.assign(wrap.style,{background:T.surface3,borderRadius:"99px",height:"5px",overflow:"hidden"});
  const fill=document.createElement("div");
  Object.assign(fill.style,{width:`${pct}%`,background:color,height:"100%",borderRadius:"99px",transition:"width .7s ease"});
  wrap.appendChild(fill);return wrap;
}

function mkDivider(my=18){const d=document.createElement("div");Object.assign(d.style,{borderTop:`1px solid ${T.border}`,margin:`${my}px 0`});return d;}

function mkStars(val,onChange,size=22){
  const wrap=document.createElement("div");
  wrap.style.cssText="display:flex;gap:4px;";
  [1,2,3,4,5].forEach(n=>{
    const s=document.createElement("span");
    s.textContent="★";
    Object.assign(s.style,{fontSize:`${size}px`,cursor:onChange?"pointer":"default",opacity:n<=val?"1":"0.15",transition:"opacity .15s"});
    if(onChange)s.addEventListener("click",()=>onChange(n));
    wrap.appendChild(s);
  });
  return wrap;
}

function mkModal(title,content,wide=false){
  const overlay=document.createElement("div");
  overlay.className="ov";
  Object.assign(overlay.style,{position:"fixed",inset:"0",background:"rgba(0,0,0,.88)",zIndex:"999",display:"flex",alignItems:"center",justifyContent:"center",padding:"16px"});
  overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.remove();});

  const box=document.createElement("div");
  box.className="a0";
  Object.assign(box.style,{background:T.surface,border:`1px solid ${T.border2}`,borderRadius:"20px",padding:"28px",width:"100%",maxWidth:wide?"560px":"460px",maxHeight:"90vh",overflowY:"auto"});

  const hd=document.createElement("div");
  Object.assign(hd.style,{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"24px"});
  const ttl=document.createElement("h3");
  Object.assign(ttl.style,{fontFamily:"'Playfair Display',serif",fontSize:"21px",fontWeight:"600",color:T.text});
  ttl.textContent=title;
  const closeBtn=document.createElement("button");
  Object.assign(closeBtn.style,{background:T.surface2,border:"none",borderRadius:"8px",width:"34px",height:"34px",cursor:"pointer",color:T.text3,fontSize:"20px",display:"flex",alignItems:"center",justifyContent:"center"});
  closeBtn.textContent="×";
  closeBtn.addEventListener("click",()=>overlay.remove());
  hd.appendChild(ttl);hd.appendChild(closeBtn);
  box.appendChild(hd);
  box.appendChild(content);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  return {overlay,box};
}

function mkFld(label){const w=document.createElement("div");w.style.marginBottom="14px";if(label){const l=document.createElement("label");Object.assign(l.style,{display:"block",fontSize:"11px",fontWeight:"600",color:T.text3,letterSpacing:"0.09em",textTransform:"uppercase",marginBottom:"7px"});l.textContent=label;w.appendChild(l);}return w;}

function mkSectionHeader(eyebrow,title,actionEl=null){
  const wrap=document.createElement("div");
  Object.assign(wrap.style,{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:"28px"});
  const left=document.createElement("div");
  const eye=document.createElement("p");
  Object.assign(eye.style,{fontSize:"11px",color:T.text3,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:"6px"});
  eye.textContent=eyebrow;
  const ttl=document.createElement("h2");
  Object.assign(ttl.style,{fontFamily:"'Playfair Display',serif",fontSize:"30px",color:T.text});
  ttl.textContent=title;
  left.appendChild(eye);left.appendChild(ttl);wrap.appendChild(left);
  if(actionEl)wrap.appendChild(actionEl);
  return wrap;
}

function showToast(msg,ok=true){
  const t=document.createElement("div");
  Object.assign(t.style,{position:"fixed",bottom:"100px",left:"50%",transform:"translateX(-50%)",background:ok?"#1a3a2a":"#3a1a1a",color:ok?T.green:T.red,border:`1px solid ${ok?"#2a5a3a":"#5a2a2a"}`,borderRadius:"99px",padding:"10px 20px",fontSize:"13px",fontWeight:"600",zIndex:"9999",whiteSpace:"nowrap"});
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

function mkLoading(){
  const d=document.createElement("div");
  Object.assign(d.style,{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"60px 0",gap:"14px"});
  const sp=document.createElement("div");
  Object.assign(sp.style,{width:"28px",height:"28px",border:`2px solid ${T.border2}`,borderTop:`2px solid #fff`,borderRadius:"50%"});
  sp.className="spin";
  const p=document.createElement("p");
  Object.assign(p.style,{color:T.text3,fontSize:"13px"});
  p.textContent="불러오는 중...";
  d.appendChild(sp);d.appendChild(p);return d;
}

// ════════════════════════════════════════
// FIREBASE 데이터 CRUD
// ════════════════════════════════════════
async function loadAllData(){
  if(!FB||!uid()) return;
  const {db,collection,query,where,onSnapshot,doc}=FB;
  const trainerId=uid();

  // 기존 구독 해제
  STATE.unsubs.forEach(u=>u());STATE.unsubs=[];

  // members
  const mq=query(collection(db,"members"),where("trainerId","==",trainerId));
  const u1=onSnapshot(mq,snap=>{STATE.members=snap.docs.map(d=>({id:d.id,...d.data()}));render();});

  // logs
  const lq=query(collection(db,"logs"),where("trainerId","==",trainerId));
  const u2=onSnapshot(lq,snap=>{STATE.logs=snap.docs.map(d=>({id:d.id,...d.data()}));render();});

  // diets
  const dq=query(collection(db,"diets"),where("trainerId","==",trainerId));
  const u3=onSnapshot(dq,snap=>{STATE.diets=snap.docs.map(d=>({id:d.id,...d.data()}));render();});

  // schedules
  const sq=query(collection(db,"schedules"),where("trainerId","==",trainerId));
  const u4=onSnapshot(sq,snap=>{STATE.schedules=snap.docs.map(d=>({id:d.id,...d.data()}));render();});

  STATE.unsubs=[u1,u2,u3,u4];
}

async function loadMemberData(memberId){
  if(!FB) return;
  const {db,collection,query,where,onSnapshot}=FB;

  STATE.unsubs.forEach(u=>u());STATE.unsubs=[];

  // 해당 회원 데이터만
  const lq=query(collection(db,"logs"),where("memberId","==",memberId));
  const u1=onSnapshot(lq,snap=>{STATE.logs=snap.docs.map(d=>({id:d.id,...d.data()}));render();});

  const dq=query(collection(db,"diets"),where("memberId","==",memberId));
  const u2=onSnapshot(dq,snap=>{STATE.diets=snap.docs.map(d=>({id:d.id,...d.data()}));render();});

  const sq=query(collection(db,"schedules"),where("memberId","==",memberId));
  const u3=onSnapshot(sq,snap=>{STATE.schedules=snap.docs.map(d=>({id:d.id,...d.data()}));render();});

  // 내 정보
  const {doc,getDoc}=FB;
  const me=await getDoc(doc(db,"members",memberId));
  if(me.exists()) STATE.members=[{id:me.id,...me.data()}];

  STATE.unsubs=[u1,u2,u3];
}

async function addDoc2(col,data){
  const {db,collection,addDoc,serverTimestamp}=FB;
  return addDoc(collection(db,col),{...data,createdAt:serverTimestamp()});
}

async function updateDoc2(col,id,data){
  const {db,doc,updateDoc}=FB;
  return updateDoc(doc(db,col,id),data);
}

async function setDoc2(col,id,data){
  const {db,doc,setDoc}=FB;
  return setDoc(doc(db,col,id),data,{merge:true});
}

// ════════════════════════════════════════
// LOGIN / SIGNUP SCREEN
// ════════════════════════════════════════
function renderAuth(){
  const root=el("app");root.innerHTML="";
  const wrap=document.createElement("div");
  Object.assign(wrap.style,{minHeight:"100vh",background:T.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"});

  const box=document.createElement("div");
  box.className="a0";
  Object.assign(box.style,{width:"100%",maxWidth:"400px"});

  // 로고
  const logo=document.createElement("div");
  Object.assign(logo.style,{textAlign:"center",marginBottom:"48px"});
  logo.innerHTML=`
    <div style="width:60px;height:60px;background:#fff;border-radius:16px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:26px">◼</div>
    <p style="font-size:11px;color:${T.text3};letter-spacing:0.18em;text-transform:uppercase;margin-bottom:8px">Personal Training</p>
    <h1 style="font-family:'Playfair Display',serif;font-size:38px;font-weight:700;color:#fff;line-height:1.1">PT Manager</h1>
    <p style="font-size:14px;color:${T.text3};margin-top:10px;font-weight:300">스마트 트레이닝 관리 시스템</p>
  `;

  // 탭
  let authMode="login"; // login | signup | member
  const tabWrap=document.createElement("div");
  Object.assign(tabWrap.style,{display:"flex",gap:"8px",marginBottom:"24px"});

  const mkTab=(label,mode)=>{
    const b=document.createElement("button");
    Object.assign(b.style,{flex:"1",padding:"10px",borderRadius:"10px",border:"none",cursor:"pointer",fontSize:"13px",fontWeight:"600",transition:"all .15s"});
    b.textContent=label;
    b.dataset.mode=mode;
    return b;
  };

  const tabs=[mkTab("트레이너 로그인","login"),mkTab("트레이너 가입","signup"),mkTab("회원 입장","member")];
  tabs.forEach(t=>{tabWrap.appendChild(t);t.addEventListener("click",()=>{authMode=t.dataset.mode;updateTabs();updateForm();});});

  const updateTabs=()=>{
    tabs.forEach(t=>{
      const active=t.dataset.mode===authMode;
      Object.assign(t.style,{background:active?"#fff":T.surface2,color:active?"#000":T.text3,border:active?"none":`1px solid ${T.border2}`});
    });
  };
  updateTabs();

  // 폼 영역
  const formArea=document.createElement("div");

  const updateForm=()=>{
    formArea.innerHTML="";
    if(authMode==="login") formArea.appendChild(makeLoginForm());
    else if(authMode==="signup") formArea.appendChild(makeSignupForm());
    else formArea.appendChild(makeMemberForm());
  };

  // 트레이너 로그인
  const makeLoginForm=()=>{
    const wrap=document.createElement("div");
    const emailF=mkFld("이메일");const emailI=makeInp({type:"email",placeholder:"trainer@email.com"});emailF.appendChild(emailI);
    const pwF=mkFld("비밀번호");const pwI=makeInp({type:"password",placeholder:"••••••••"});pwF.appendChild(pwI);
    const errP=document.createElement("p");Object.assign(errP.style,{color:T.red,fontSize:"13px",marginBottom:"12px",textAlign:"center",minHeight:"18px"});
    const loginBtn=mkBtn("로그인","",  "white","lg",{width:"100%"});
    loginBtn.addEventListener("click",async()=>{
      errP.textContent="";
      loginBtn.innerHTML=`<span class="spin">⟳</span> 로그인 중...`;
      try{
        await FB.signInWithEmailAndPassword(FB.auth,emailI.value,pwI.value);
      }catch(e){
        errP.textContent="이메일 또는 비밀번호가 올바르지 않습니다.";
        loginBtn.textContent="로그인";
      }
    });
    wrap.appendChild(emailF);wrap.appendChild(pwF);wrap.appendChild(errP);wrap.appendChild(loginBtn);
    return wrap;
  };

  // 트레이너 회원가입
  const makeSignupForm=()=>{
    const wrap=document.createElement("div");
    const nameF=mkFld("트레이너 이름");const nameI=makeInp({type:"text",placeholder:"홍길동 트레이너"});nameF.appendChild(nameI);
    const emailF=mkFld("이메일");const emailI=makeInp({type:"email",placeholder:"trainer@email.com"});emailF.appendChild(emailI);
    const pwF=mkFld("비밀번호 (6자리 이상)");const pwI=makeInp({type:"password",placeholder:"••••••••"});pwF.appendChild(pwI);
    const errP=document.createElement("p");Object.assign(errP.style,{color:T.red,fontSize:"13px",marginBottom:"12px",textAlign:"center",minHeight:"18px"});
    const signupBtn=mkBtn("계정 만들기","","white","lg",{width:"100%"});
    signupBtn.addEventListener("click",async()=>{
      errP.textContent="";
      if(!nameI.value){errP.textContent="이름을 입력해주세요.";return;}
      if(pwI.value.length<6){errP.textContent="비밀번호는 6자리 이상이어야 합니다.";return;}
      signupBtn.innerHTML=`<span class="spin">⟳</span> 생성 중...`;
      try{
        const cred=await FB.createUserWithEmailAndPassword(FB.auth,emailI.value,pwI.value);
        await FB.updateProfile(cred.user,{displayName:nameI.value});
        // 트레이너 프로필 저장
        await setDoc2("trainers",cred.user.uid,{name:nameI.value,email:emailI.value,createdAt:new Date().toISOString()});
        showToast("가입 완료! 환영합니다 💪");
      }catch(e){
        const msgs={"auth/email-already-in-use":"이미 사용중인 이메일입니다.","auth/invalid-email":"올바른 이메일 형식이 아닙니다."};
        errP.textContent=msgs[e.code]||"오류가 발생했습니다. 다시 시도해주세요.";
        signupBtn.textContent="계정 만들기";
      }
    });
    wrap.appendChild(nameF);wrap.appendChild(emailF);wrap.appendChild(pwF);wrap.appendChild(errP);wrap.appendChild(signupBtn);
    return wrap;
  };

  // 회원 입장
  const makeMemberForm=()=>{
    const wrap=document.createElement("div");

    // 트레이너 이메일로 회원 찾기
    const tEmailF=mkFld("트레이너 이메일");
    const tEmailI=makeInp({type:"email",placeholder:"트레이너 이메일 입력"});
    tEmailF.appendChild(tEmailI);

    const searchBtn=mkBtn("회원 목록 불러오기","","outline","md",{width:"100%",marginBottom:"14px"});
    const memberSel=document.createElement("div");
    const errP=document.createElement("p");Object.assign(errP.style,{color:T.red,fontSize:"13px",marginBottom:"12px",textAlign:"center",minHeight:"18px"});

    searchBtn.addEventListener("click",async()=>{
      errP.textContent="";memberSel.innerHTML="";
      searchBtn.innerHTML=`<span class="spin">⟳</span> 검색 중...`;
      try{
        const {db,collection,query,where,getDocs}=FB;
        // 트레이너 찾기
        const tSnap=await getDocs(query(collection(db,"trainers"),where("email","==",tEmailI.value.trim())));
        if(tSnap.empty){errP.textContent="해당 이메일의 트레이너를 찾을 수 없습니다.";searchBtn.textContent="회원 목록 불러오기";return;}
        const trainerId=tSnap.docs[0].id;

        // 회원 목록
        const mSnap=await getDocs(query(collection(db,"members"),where("trainerId","==",trainerId)));
        if(mSnap.empty){errP.textContent="등록된 회원이 없습니다.";searchBtn.textContent="회원 목록 불러오기";return;}

        const fld=mkFld("회원 선택");
        const opts=[{val:"",label:"이름을 선택하세요"},...mSnap.docs.map(d=>({val:d.id,label:d.data().name}))];
        const sel=makeSel(opts,"");
        fld.appendChild(sel);memberSel.appendChild(fld);

        const enterBtn=mkBtn("입장하기","","white","lg",{width:"100%"});
        enterBtn.addEventListener("click",()=>{
          if(!sel.value){errP.textContent="회원을 선택해주세요.";return;}
          STATE.role="member";STATE.myMemberId=sel.value;STATE.tab="workout";
          loadMemberData(sel.value).then(()=>{STATE.loading=false;render();});
        });
        memberSel.appendChild(enterBtn);
        searchBtn.textContent="회원 목록 불러오기";
      }catch(e){
        errP.textContent="오류가 발생했습니다.";
        searchBtn.textContent="회원 목록 불러오기";
      }
    });

    wrap.appendChild(tEmailF);wrap.appendChild(searchBtn);wrap.appendChild(errP);wrap.appendChild(memberSel);
    return wrap;
  };

  updateForm();
  box.appendChild(logo);box.appendChild(tabWrap);box.appendChild(formArea);
  wrap.appendChild(box);root.appendChild(wrap);
}

// ── 식단 기록 (회원)
function renderDietMember(){
  const wrap=document.createElement("div");

  const myDiets=[...STATE.diets].sort((a,b)=>b.date.localeCompare(a.date));

  else myDiets.forEach(d=>{

    card.appendChild(top);
    d.meals.forEach(meal=>{
      const mw=document.createElement("div");mw.style.marginBottom="14px";
      const ml=document.createElement("p");Object.assign(ml.style,{fontSize:"11px",color:T.text3,letterSpacing:"0.07em",marginBottom:"8px"});ml.textContent=`${ICON[meal.time]||"🍽"} ${meal.time.toUpperCase()}`;mw.appendChild(ml);
      meal.items.forEach(it=>{
        const row=document.createElement("div");Object.assign(row.style,{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:`1px solid ${T.surface2}`});
        row.innerHTML=`<span style="font-size:14px;color:#d0d0d0">${it.food}</span><span style="font-family:'Playfair Display',serif;font-size:14px;color:${T.text2}">${it.kcal} kcal</span>`;mw.appendChild(row);
      });
      card.appendChild(mw);
    });
    card.appendChild(mkDivider(14));
    const tags=document.createElement("div");tags.style.cssText="display:flex;gap:10px;flex-wrap:wrap;";
    tags.appendChild(mkTag(`💧 ${d.water}L`));tags.appendChild(mkTag(`☕ 커피 ${d.coffee}잔`));card.appendChild(tags);
    if(d.trainerRating>0){
      const fb=document.createElement("div");Object.assign(fb.style,{marginTop:"14px",background:T.surface2,borderRadius:"12px",padding:"14px 16px"});
      const fbTop=document.createElement("div");Object.assign(fbTop.style,{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:d.trainerComment?"10px":"0"});
      const fbl=document.createElement("p");Object.assign(fbl.style,{fontSize:"11px",color:T.text3,letterSpacing:"0.07em"});fbl.textContent="TRAINER FEEDBACK";
      fbTop.appendChild(fbl);fbTop.appendChild(mkStars(d.trainerRating,null,15));fb.appendChild(fbTop);
      if(d.trainerComment){const cp=document.createElement("p");Object.assign(cp.style,{fontSize:"13px",color:T.text2,lineHeight:"1.7"});cp.textContent=d.trainerComment;fb.appendChild(cp);}
      card.appendChild(fb);
    }
    wrap.appendChild(card);
  });

  const showAddModal=()=>{
    const content=document.createElement("div");
    const MEAL_TIMES=["아침","점심","저녁","간식"];
    let meals=[{time:"아침",items:[{food:"",kcal:""}]},{time:"점심",items:[{food:"",kcal:""}]},{time:"저녁",items:[{food:"",kcal:""}]}];

    const grid=document.createElement("div");Object.assign(grid.style,{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"});
    const dateFld=mkFld("날짜");dateFld.style.gridColumn="1/-1";const dateI=makeInp({type:"date",value:today()});dateFld.appendChild(dateI);
    const wFld=mkFld("수분 (L)");const wI=makeInp({type:"number",step:"0.5",placeholder:"2.0"});wFld.appendChild(wI);
    const cFld=mkFld("커피 (잔)");const cI=makeInp({type:"number",placeholder:"1"});cFld.appendChild(cI);
    grid.appendChild(dateFld);grid.appendChild(wFld);grid.appendChild(cFld);content.appendChild(grid);
    content.appendChild(mkDivider());

    const mealArea=document.createElement("div");
    const aiRow=document.createElement("div");Object.assign(aiRow.style,{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"});
    aiRow.appendChild(mkLabel("끼니별 식단"));
    const aiBtn=document.createElement("button");Object.assign(aiBtn.style,{background:"#fff",color:"#000",border:"none",borderRadius:"9px",padding:"8px 16px",cursor:"pointer",fontSize:"12px",fontWeight:"700",display:"flex",alignItems:"center",gap:"6px"});
    aiBtn.innerHTML="✦ AI 칼로리 자동계산";
    const mealInputs={};

    const renderMeals=()=>{
      mealArea.innerHTML="";
      meals.forEach((meal,mi)=>{
        const mw=document.createElement("div");mw.style.marginBottom="20px";
        const ml=document.createElement("p");Object.assign(ml.style,{fontSize:"12px",color:T.text2,marginBottom:"10px"});ml.textContent=`${ICON[meal.time]} ${meal.time}`;mw.appendChild(ml);
        if(!mealInputs[meal.time])mealInputs[meal.time]=[];
        meal.items.forEach((it,ii)=>{
          const row=document.createElement("div");Object.assign(row.style,{display:"grid",gridTemplateColumns:"3fr 1fr",gap:"8px",marginBottom:"8px"});
          const fi=makeInp({type:"text",placeholder:"음식명 (예: 닭가슴살)"},{padding:"10px 12px"});
          fi.value=it.food;
          fi.addEventListener("input",e=>{const k=findKcal(e.target.value);meals[mi].items[ii].food=e.target.value;if(k!==null){meals[mi].items[ii].kcal=k;ki.value=k;ki.style.color=T.green;}});
          const ki=makeInp({type:"number",placeholder:"kcal"},{padding:"10px",color:it.kcal?T.green:T.text3});
          ki.value=it.kcal||"";ki.addEventListener("input",e=>meals[mi].items[ii].kcal=+e.target.value);
          row.appendChild(fi);row.appendChild(ki);mw.appendChild(row);
          if(!mealInputs[meal.time][ii])mealInputs[meal.time][ii]={fi,ki};
          else{mealInputs[meal.time][ii].fi=fi;mealInputs[meal.time][ii].ki=ki;}
        });
        const addItemBtn=document.createElement("button");Object.assign(addItemBtn.style,{background:"none",border:"none",color:T.text4,fontSize:"12px",cursor:"pointer",padding:"0"});addItemBtn.textContent="+ 음식 추가";
        addItemBtn.addEventListener("click",()=>{meals[mi].items.push({food:"",kcal:""});renderMeals();});
        mw.appendChild(addItemBtn);mealArea.appendChild(mw);
      });
    };

    aiBtn.addEventListener("click",async()=>{
      const foods=meals.flatMap(m=>m.items.map(it=>it.food)).filter(Boolean);
      if(!foods.length){showToast("음식을 먼저 입력해주세요",false);return;}
      aiBtn.innerHTML=`<span class="spin">⟳</span> 계산 중...`;
      try{
        const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:600,messages:[{role:"user",content:`다음 음식들의 1인분 칼로리를 JSON으로만 반환. 키=음식명, 값=정수. 다른 텍스트 없이 JSON만: ${foods.join(", ")}`}]})});
        const data=await r.json();
        const raw=data.content?.map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
        const parsed=JSON.parse(raw);
        meals.forEach(meal=>{meal.items.forEach(it=>{if(!it.food)return;const k=Object.keys(parsed).find(k=>k.includes(it.food)||it.food.includes(k));if(k)it.kcal=parsed[k];});});
        renderMeals();showToast("칼로리 계산 완료!");
      }catch{
        meals.forEach(meal=>{meal.items.forEach(it=>{const k=findKcal(it.food);if(k!==null)it.kcal=k;});});
        renderMeals();
      }
      aiBtn.innerHTML="✦ AI 칼로리 자동계산";
    });

    aiRow.appendChild(aiBtn);content.appendChild(aiRow);
    const hint=document.createElement("p");Object.assign(hint.style,{fontSize:"11px",color:T.text4,marginBottom:"16px"});hint.textContent="음식명 입력 시 자동으로 kcal이 채워집니다.";content.appendChild(hint);
    content.appendChild(mealArea);renderMeals();

    // 끼니 추가 버튼
    const addMealWrap=document.createElement("div");Object.assign(addMealWrap.style,{display:"flex",gap:"8px",marginBottom:"16px",flexWrap:"wrap"});
    MEAL_TIMES.filter(t=>!meals.find(m=>m.time===t)).forEach(t=>{
      const b=document.createElement("button");Object.assign(b.style,{background:T.surface2,border:`1px solid ${T.border2}`,borderRadius:"99px",padding:"5px 14px",fontSize:"12px",color:T.text3,cursor:"pointer"});b.textContent=`+ ${t}`;
      b.addEventListener("click",()=>{meals.push({time:t,items:[{food:"",kcal:""}]});renderMeals();addMealWrap.innerHTML="";MEAL_TIMES.filter(t=>!meals.find(m=>m.time===t)).forEach(t2=>{/*rebuild*/});});
      addMealWrap.appendChild(b);
    });
    content.appendChild(addMealWrap);

    const saveBtn=mkBtn("저장하기",async()=>{
      const validMeals=meals.map(m=>({...m,items:m.items.filter(it=>it.food)})).filter(m=>m.items.length>0);
      if(!validMeals.length){showToast("식단을 입력해주세요",false);return;}
      const tot=validMeals.reduce((a,m)=>a+m.items.reduce((b,it)=>b+(+it.kcal||0),0),0);
      saveBtn.innerHTML=`<span class="spin">⟳</span> 저장 중...`;
      const m=STATE.members.find(x=>x.id===STATE.myMemberId);
      try{
        await addDoc2("diets",{trainerId:m?.trainerId,memberId:STATE.myMemberId,date:dateI.value,meals:validMeals,water:+wI.value,coffee:+cI.value,totalKcal:tot,trainerRating:0,trainerComment:""});
        showToast("식단 저장 완료!");document.querySelector(".ov")?.remove();
      }catch(e){showToast("오류가 발생했습니다",false);saveBtn.textContent="저장하기";}
    },"white","lg",{width:"100%"});
    content.appendChild(saveBtn);
    mkModal("식단 기록",content,true);
  };

  return wrap;
}

        btnRow.appendChild(saveBtn);btnRow.appendChild(cancelBtn);evalArea.appendChild(btnRow);
      }
      card.appendChild(evalArea);wrap.appendChild(card);
    });
  };

  rerender();return wrap;
}

// ── 체중 입력 (회원)
function renderWeight(){
  const wrap=document.createElement("div");
  wrap.appendChild(mkSectionHeader("Weight Tracking","체중 기록"));

  const m=STATE.members.find(x=>x.id===STATE.myMemberId);
  if(!m){const p=document.createElement("p");p.style.color=T.text4;p.textContent="정보를 불러오는 중...";wrap.appendChild(p);return wrap;}

  const wLog=m.weightLog||[],w0=wLog[0]?.w,wN=wLog.at(-1)?.w;
  const diff=wLog.length>=2?(wN-w0).toFixed(1):null;

  const card=mkCard({marginBottom:"14px"});card.appendChild(mkLabel("나의 체중 변화"));
  const grid=document.createElement("div");Object.assign(grid.style,{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginTop:"14px",marginBottom:"20px"});
  [["시작",`${w0}kg`],["현재",`${wLog.at(-1)?.w}kg`],["변화",diff!==null?`${+diff>0?"+":""}${diff}kg`:"—"]].forEach(([k,v])=>{
    const cell=document.createElement("div");Object.assign(cell.style,{background:T.surface2,borderRadius:"12px",padding:"16px 12px",textAlign:"center"});
    cell.innerHTML=`<p style="font-size:10px;color:${T.text4};margin-bottom:8px">${k}</p><p style="font-family:'Playfair Display',serif;font-size:22px;color:${k==="변화"&&diff!==null?(+diff<0?T.green:+diff>0?T.red:T.text):T.text}">${v}</p>`;
    grid.appendChild(cell);
  });
  card.appendChild(grid);

  const histLabel=document.createElement("p");Object.assign(histLabel.style,{fontSize:"11px",color:T.text3,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"12px"});histLabel.textContent="기록 내역";card.appendChild(histLabel);
  [...wLog].reverse().slice(0,8).forEach(entry=>{
    const row=document.createElement("div");Object.assign(row.style,{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:`1px solid ${T.border}`});
    row.innerHTML=`<span style="font-size:13px;color:${T.text3}">${entry.date}</span><span style="font-family:'Playfair Display',serif;font-size:18px;color:${T.text}">${entry.w} kg</span>`;
    card.appendChild(row);
  });
  wrap.appendChild(card);

  // 입력 카드
  const inputCard=mkCard();inputCard.appendChild(mkLabel("오늘 체중 입력"));
  const inputRow=document.createElement("div");Object.assign(inputRow.style,{display:"flex",gap:"10px",marginTop:"14px"});
  const wInput=makeInp({type:"number",step:"0.1",placeholder:"59.5"},{flex:"1",fontSize:"22px",textAlign:"center",letterSpacing:"0.04em"});
  const saveBtn=mkBtn("저장",async()=>{
    if(!wInput.value){showToast("체중을 입력해주세요",false);return;}
    const val=+wInput.value;const td=today();
    saveBtn.innerHTML=`<span class="spin">⟳</span>`;
    try{
      const newLog=[...(m.weightLog||[]),{date:td,w:val}];
      await updateDoc2("members",STATE.myMemberId,{weightLog:newLog,weight:val});
      wInput.value="";showToast("체중 저장 완료! ✓");
    }catch(e){showToast("오류가 발생했습니다",false);}
    saveBtn.textContent="저장";
  },"white","md");
  inputRow.appendChild(wInput);inputRow.appendChild(saveBtn);inputCard.appendChild(inputRow);
  const hint=document.createElement("p");Object.assign(hint.style,{fontSize:"11px",color:T.text4,textAlign:"center",marginTop:"14px"});hint.textContent="입력하면 트레이너가 변화를 실시간으로 확인합니다";inputCard.appendChild(hint);
  wrap.appendChild(inputCard);
  return wrap;
}

// ── 일정
function renderSchedule(){
  const wrap=document.createElement("div");
  const isT=STATE.role==="trainer";

  wrap.appendChild(mkSectionHeader("Schedule","PT 일정",!isT?null:mkBtn("+ 일정 추가",()=>showAddModal(),"white","md")));

  const list=isT?STATE.schedules:STATE.schedules.filter(s=>s.memberId===STATE.myMemberId);
  const upcoming=[...list.filter(s=>s.status==="예정")].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const done=[...list.filter(s=>s.status==="완료")].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));

  const mkRow=(s,canComplete)=>{
    const m=STATE.members.find(x=>x.id===s.memberId);
    const row=document.createElement("div");Object.assign(row.style,{display:"flex",alignItems:"center",gap:"14px",padding:"13px 0",borderBottom:`1px solid ${T.border}`});
    const time=document.createElement("div");Object.assign(time.style,{background:T.surface2,borderRadius:"10px",padding:"9px 14px",minWidth:"58px",textAlign:"center"});
    time.innerHTML=`<p style="font-family:'Playfair Display',serif;font-size:17px;color:${T.text}">${s.time}</p><p style="font-size:10px;color:${T.text4};margin-top:2px">${s.date.slice(5)}</p>`;
    const info=document.createElement("div");info.style.flex="1";
    info.innerHTML=`<p style="font-size:15px;font-weight:600;color:${T.text}">${m?.name||""}</p><p style="font-size:12px;color:${T.text3};margin-top:2px">${s.duration}분</p>`;
    row.appendChild(time);row.appendChild(info);
    if(canComplete){const btn=mkBtn("완료",async()=>{await updateDoc2("schedules",s.id,{status:"완료"});showToast("완료 처리되었습니다");},"outline","sm");row.appendChild(btn);}
    else{const badge=document.createElement("span");Object.assign(badge.style,{fontSize:"11px",color:T.green,background:"#0b1f14",border:"1px solid #1a3528",borderRadius:"99px",padding:"4px 11px"});badge.textContent="완료";row.appendChild(badge);}
    return row;
  };

  const upCard=mkCard({marginBottom:"14px"});
  const upHd=document.createElement("div");Object.assign(upHd.style,{display:"flex",justifyContent:"space-between",marginBottom:"16px"});
  upHd.appendChild(mkLabel("예정된 일정"));upHd.appendChild(mkTag(`${upcoming.length}건`));upCard.appendChild(upHd);
  if(upcoming.length===0){const p=document.createElement("p");Object.assign(p.style,{color:T.text4,fontSize:"14px",padding:"16px 0"});p.textContent="예정된 일정이 없습니다";upCard.appendChild(p);}
  else upcoming.forEach(s=>upCard.appendChild(mkRow(s,isT)));
  wrap.appendChild(upCard);

  const doneCard=mkCard();
  const doneHd=document.createElement("div");Object.assign(doneHd.style,{display:"flex",justifyContent:"space-between",marginBottom:"16px"});
  doneHd.appendChild(mkLabel("완료된 세션"));doneHd.appendChild(mkTag(`${done.length}건`));doneCard.appendChild(doneHd);
  if(done.length===0){const p=document.createElement("p");Object.assign(p.style,{color:T.text4,fontSize:"14px",padding:"16px 0"});p.textContent="완료된 세션이 없습니다";doneCard.appendChild(p);}
  else done.forEach(s=>doneCard.appendChild(mkRow(s,false)));
  wrap.appendChild(doneCard);

  const showAddModal=()=>{
    const content=document.createElement("div");
    const mFld=mkFld("회원");const mSel=makeSel([{val:"",label:"회원 선택"},...STATE.members.map(m=>({val:m.id,label:m.name}))],  "");mFld.appendChild(mSel);content.appendChild(mFld);
    const grid=document.createElement("div");Object.assign(grid.style,{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"});
    const dateFld=mkFld("날짜");const dateI=makeInp({type:"date",value:today()});dateFld.appendChild(dateI);
    const timeFld=mkFld("시간");const timeI=makeInp({type:"time",value:"10:00"});timeFld.appendChild(timeI);
    const durFld=mkFld("세션 시간 (분)");const durI=makeInp({type:"number",value:"60"});durFld.appendChild(durI);
    grid.appendChild(dateFld);grid.appendChild(timeFld);grid.appendChild(durFld);content.appendChild(grid);
    const saveBtn=mkBtn("일정 추가",async()=>{
      if(!mSel.value){showToast("회원을 선택해주세요",false);return;}
      saveBtn.innerHTML=`<span class="spin">⟳</span> 저장 중...`;
      try{
        await addDoc2("schedules",{trainerId:uid(),memberId:mSel.value,date:dateI.value,time:timeI.value,duration:+durI.value,status:"예정"});
        showToast("일정 추가 완료!");document.querySelector(".ov")?.remove();
      }catch(e){showToast("오류가 발생했습니다",false);saveBtn.textContent="일정 추가";}
    },"white","lg",{width:"100%"});
    content.appendChild(saveBtn);
    mkModal("PT 일정 추가",content);
  };

  return wrap;
}

// ════════════════════════════════════════
// 앱 초기화
// ════════════════════════════════════════
window.addEventListener("fb-ready",()=>{
  FB=window._fb;
  FB.onAuthStateChanged(FB.auth,async user=>{
    if(user){
      STATE.user=user;STATE.role="trainer";STATE.tab="dash";STATE.loading=true;render();
      await loadAllData();STATE.loading=false;render();
    }else{
      if(STATE.role!=="member"){STATE.user=null;STATE.role=null;STATE.loading=false;render();}
    }
  });
});

// 초기 로딩
renderLoading();
</script>
