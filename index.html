<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>PT Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#060606;color:#fff;font-family:'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:'Noto Sans KR',sans-serif}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#222;border-radius:9px}
input::placeholder,textarea::placeholder{color:#333}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.a0{animation:fadeUp .3s ease both}
.a1{animation:fadeUp .3s .06s ease both;opacity:0}
.ov{animation:fadeIn .2s ease both}
.spin{animation:spin .7s linear infinite;display:inline-block}
</style>
</head>
<body>
<div id="app">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px">
    <div style="width:30px;height:30px;border:2px solid #222;border-top:2px solid #fff;border-radius:50%;animation:spin .7s linear infinite"></div>
    <p style="color:#444;font-size:14px">PT Manager 로딩 중...</p>
  </div>
</div>

  짜장면:520,짬뽕:450,볶음밥:400,김밥:320,샌드위치:310,식빵:265,

  카푸치노:110,녹차:2,프로틴바:200,소고기:271,새우:99,고등어:202,
  계란프라이:90,토스트:265,시리얼:380,치킨:239,피자:266,햄버거:354
};

function findKcal(n) {
  if (!n) return null;
  const s = n.trim().replace(/\s+/g,"").toLowerCase();
  for (const [k,v] of Object.entries(KCAL)) {
    if (s.includes(k) || k.includes(s)) return v;
  }
  return null;
}

// ── 앱 상태
const STATE = {
  role: null, myMemberId: null, tab: "dash",
  members: [], logs: [], diets: [], schedules: [],
  unsubs: []
};

const today = () => new Date().toISOString().slice(0,10);
const $ = id => document.getElementById(id);

// ── 공통 UI
const INP = {width:"100%",padding:"12px 14px",background:T.surface2,border:`1px solid ${T.border2}`,borderRadius:"10px",color:T.text,fontSize:"14px",outline:"none"};

function el(tag, style={}, html="") {
  const e = document.createElement(tag);
  Object.assign(e.style, style);
  if (html) e.innerHTML = html;
  return e;
}

function inp(attrs={}, sx={}) {
  const i = document.createElement("input");
  Object.assign(i.style, INP, sx);
  Object.entries(attrs).forEach(([k,v]) => i.setAttribute(k,v));
  return i;
}

function sel(options, val="", sx={}) {
  const s = document.createElement("select");
  Object.assign(s.style, {...INP, ...sx});
  options.forEach(o => {
    const op = document.createElement("option");
    op.value = o.v||o; op.textContent = o.l||o;
    if ((o.v||o) === val) op.selected = true;
    s.appendChild(op);
  });
  return s;
}

function ta(ph="", sx={}) {
  const t = document.createElement("textarea");
  Object.assign(t.style, {...INP, minHeight:"72px", resize:"vertical", ...sx});
  t.placeholder = ph;
  return t;
}

function btn(text, onClick, v="white", sz="md", sx={}) {
  const sizes = {sm:{padding:"7px 14px",fontSize:"12px"}, md:{padding:"11px 22px",fontSize:"14px"}, lg:{padding:"15px 26px",fontSize:"15px"}};
  const vars = {
    white:{background:"#fff",color:"#000"},
    ghost:{background:T.surface2,color:T.text2,border:`1px solid ${T.border2}`},
    outline:{background:"transparent",color:"#fff",border:`1px solid ${T.border2}`}
  };
  const b = document.createElement("button");
  Object.assign(b.style, {display:"inline-flex",alignItems:"center",justifyContent:"center",gap:"6px",border:"none",cursor:"pointer",fontWeight:"600",borderRadius:"10px",transition:"all .15s",...vars[v],...sizes[sz],...sx});
  b.innerHTML = text;
  b.addEventListener("click", onClick);
  return b;
}

function card(sx={}) {
  return el("div", {background:T.surface,border:`1px solid ${T.border}`,borderRadius:"16px",padding:"22px",...sx});
}

function lbl(text) {
  return el("p", {fontSize:"11px",fontWeight:"600",color:T.text3,letterSpacing:"0.09em",textTransform:"uppercase",marginBottom:"7px"}, text);
}

function tag(text) {
  const s = document.createElement("span");
  Object.assign(s.style, {fontSize:"11px",color:T.text3,background:T.surface2,border:`1px solid ${T.border2}`,borderRadius:"99px",padding:"3px 10px",fontWeight:"500",whiteSpace:"nowrap"});
  s.textContent = text;
  return s;
}

function bar(val, max, color="#fff") {
  const pct = Math.min(Math.round(val/max*100),100);
  const w = el("div",{background:T.surface3,borderRadius:"99px",height:"5px",overflow:"hidden"});
  w.appendChild(el("div",{width:`${pct}%`,background:color,height:"100%",borderRadius:"99px",transition:"width .7s"}));
  return w;
}

function divider(my=18) {
  return el("div",{borderTop:`1px solid ${T.border}`,margin:`${my}px 0`});
}

function stars(val, onChange, size=22) {
  const w = el("div",{display:"flex",gap:"4px"});
  [1,2,3,4,5].forEach(n => {
    const s = el("span",{fontSize:`${size}px`,cursor:onChange?"pointer":"default",opacity:n<=val?"1":"0.15",transition:"opacity .15s"},"★");
    if (onChange) s.addEventListener("click",()=>onChange(n));
    w.appendChild(s);
  });
  return w;
}

function fld(label) {
  const w = el("div",{marginBottom:"14px"});
  if (label) {
    const l = el("label",{display:"block",fontSize:"11px",fontWeight:"600",color:T.text3,letterSpacing:"0.09em",textTransform:"uppercase",marginBottom:"7px"});
    l.textContent = label;
    w.appendChild(l);
  }
  return w;
}

function modal(title, content, wide=false) {
  const ov = el("div",{position:"fixed",inset:"0",background:"rgba(0,0,0,.88)",zIndex:"999",display:"flex",alignItems:"center",justifyContent:"center",padding:"16px"});
  ov.className = "ov";
  ov.addEventListener("click", e => e.target===ov && ov.remove());
  const box = el("div",{background:T.surface,border:`1px solid ${T.border2}`,borderRadius:"20px",padding:"28px",width:"100%",maxWidth:wide?"560px":"460px",maxHeight:"90vh",overflowY:"auto"});
  box.className = "a0";
  const hd = el("div",{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"24px"});
  const ttl = el("h3",{fontFamily:"'Playfair Display',serif",fontSize:"21px",color:T.text},title);
  const cls = btn("×",()=>ov.remove(),"ghost","sm",{width:"34px",height:"34px",borderRadius:"8px"});
  hd.appendChild(ttl); hd.appendChild(cls);
  box.appendChild(hd); box.appendChild(content);
  ov.appendChild(box); document.body.appendChild(ov);
  return ov;
}

function toast(msg, ok=true) {
  const t = el("div",{position:"fixed",bottom:"100px",left:"50%",transform:"translateX(-50%)",background:ok?"#1a3a2a":"#3a1a1a",color:ok?T.green:T.red,border:`1px solid ${ok?"#2a5a3a":"#5a2a2a"}`,borderRadius:"99px",padding:"10px 20px",fontSize:"13px",fontWeight:"600",zIndex:"9999",whiteSpace:"nowrap"},msg);
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

function pageHdr(eyebrow, title, action=null) {
  const w = el("div",{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:"28px"});
  const left = el("div",{});
  left.appendChild(el("p",{fontSize:"11px",color:T.text3,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:"6px"},eyebrow));
  left.appendChild(el("h2",{fontFamily:"'Playfair Display',serif",fontSize:"30px",color:T.text},title));
  w.appendChild(left);
  if (action) w.appendChild(action);
  return w;
}

// ── Firebase CRUD
async function addDoc2(col, data) {
  return db.collection(col).add({...data, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
}

async function updateDoc2(col, id, data) {
  return db.collection(col).doc(id).update(data);
}

async function setDoc2(col, id, data) {
  return db.collection(col).doc(id).set(data, {merge:true});
}

function uid() { return auth.currentUser?.uid; }

// ── 데이터 로드
function loadTrainerData() {
  STATE.unsubs.forEach(u=>u()); STATE.unsubs=[];
  const tid = uid();
  STATE.unsubs.push(
    db.collection("members").where("trainerId","==",tid).onSnapshot(snap=>{STATE.members=snap.docs.map(d=>({id:d.id,...d.data()}));render();}),
    db.collection("logs").where("trainerId","==",tid).onSnapshot(snap=>{STATE.logs=snap.docs.map(d=>({id:d.id,...d.data()}));render();}),
    db.collection("diets").where("trainerId","==",tid).onSnapshot(snap=>{STATE.diets=snap.docs.map(d=>({id:d.id,...d.data()}));render();}),
    db.collection("schedules").where("trainerId","==",tid).onSnapshot(snap=>{STATE.schedules=snap.docs.map(d=>({id:d.id,...d.data()}));render();})
  );
}

async function loadMemberData(memberId) {
  STATE.unsubs.forEach(u=>u()); STATE.unsubs=[];
  const me = await db.collection("members").doc(memberId).get();
  if (me.exists) STATE.members = [{id:me.id,...me.data()}];
  STATE.unsubs.push(
    db.collection("logs").where("memberId","==",memberId).onSnapshot(snap=>{STATE.logs=snap.docs.map(d=>({id:d.id,...d.data()}));render();}),
    db.collection("diets").where("memberId","==",memberId).onSnapshot(snap=>{STATE.diets=snap.docs.map(d=>({id:d.id,...d.data()}));render();}),
    db.collection("schedules").where("memberId","==",memberId).onSnapshot(snap=>{STATE.schedules=snap.docs.map(d=>({id:d.id,...d.data()}));render();})
  );
}

// ════════════════════════════════
// 로그인 화면
// ════════════════════════════════
function renderAuth() {
  const root = $("app"); root.innerHTML = "";
  const wrap = el("div",{minHeight:"100vh",background:T.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"});
  const box = el("div",{width:"100%",maxWidth:"400px"});
  box.className = "a0";

  // 로고
  const logo = el("div",{textAlign:"center",marginBottom:"40px"});
  logo.innerHTML = `
    <div style="width:56px;height:56px;background:#fff;border-radius:14px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:24px">◼</div>
    <p style="font-size:11px;color:${T.text3};letter-spacing:0.18em;text-transform:uppercase;margin-bottom:8px">Personal Training</p>
    <h1 style="font-family:'Playfair Display',serif;font-size:36px;font-weight:700;color:#fff;line-height:1.1">PT Manager</h1>
    <p style="font-size:13px;color:${T.text3};margin-top:10px">스마트 트레이닝 관리 시스템</p>
  `;

  // 탭
  let mode = "login";
  const tabWrap = el("div",{display:"flex",gap:"8px",marginBottom:"24px"});
  const mkTab = (label, m) => {
    const b = document.createElement("button");
    Object.assign(b.style,{flex:"1",padding:"10px",borderRadius:"10px",border:"none",cursor:"pointer",fontSize:"12px",fontWeight:"600",transition:"all .15s"});
    b.textContent = label; b.dataset.m = m;
    return b;
  };
  const tabBtns = [mkTab("트레이너 로그인","login"), mkTab("트레이너 가입","signup"), mkTab("회원 입장","member")];
  const updateTabs = () => tabBtns.forEach(t => Object.assign(t.style,{background:t.dataset.m===mode?"#fff":T.surface2,color:t.dataset.m===mode?"#000":T.text3,border:t.dataset.m===mode?"none":`1px solid ${T.border2}`}));
  tabBtns.forEach(t => { tabWrap.appendChild(t); t.addEventListener("click",()=>{mode=t.dataset.m;updateTabs();updateForm();}); });
  updateTabs();

  const formArea = el("div",{});

  // 로그인 폼
  const loginForm = () => {
    const w = el("div",{});
    const ef = fld("이메일"); const ei = inp({type:"email",placeholder:"trainer@email.com"}); ef.appendChild(ei);
    const pf = fld("비밀번호"); const pi = inp({type:"password",placeholder:"••••••••"}); pf.appendChild(pi);
    const err = el("p",{color:T.red,fontSize:"13px",marginBottom:"12px",textAlign:"center",minHeight:"18px"},"");
    const lb = btn("로그인", async()=>{
      err.textContent=""; lb.innerHTML=`<span class="spin">⟳</span> 로그인 중...`;
      try { await auth.signInWithEmailAndPassword(ei.value, pi.value); }
      catch(e) { err.textContent="이메일 또는 비밀번호를 확인해주세요."; lb.textContent="로그인"; }
    },"white","lg",{width:"100%"});
    w.appendChild(ef); w.appendChild(pf); w.appendChild(err); w.appendChild(lb);
    return w;
  };

  // 가입 폼
  const signupForm = () => {
    const w = el("div",{});
    const nf = fld("트레이너 이름"); const ni = inp({type:"text",placeholder:"홍길동 트레이너"}); nf.appendChild(ni);
    const ef = fld("이메일"); const ei = inp({type:"email",placeholder:"trainer@email.com"}); ef.appendChild(ei);
    const pf = fld("비밀번호 (6자리 이상)"); const pi = inp({type:"password",placeholder:"••••••••"}); pf.appendChild(pi);
    const err = el("p",{color:T.red,fontSize:"13px",marginBottom:"12px",textAlign:"center",minHeight:"18px"},"");
    const sb = btn("계정 만들기", async()=>{
      err.textContent="";
      if (!ni.value) { err.textContent="이름을 입력해주세요."; return; }
      if (pi.value.length<6) { err.textContent="비밀번호는 6자리 이상이어야 합니다."; return; }
      sb.innerHTML=`<span class="spin">⟳</span> 생성 중...`;
      try {
        const cred = await auth.createUserWithEmailAndPassword(ei.value, pi.value);
        await cred.user.updateProfile({displayName: ni.value});
        await setDoc2("trainers", cred.user.uid, {name:ni.value, email:ei.value, createdAt:new Date().toISOString()});
        toast("가입 완료! 환영합니다 💪");
      } catch(e) {
        const msgs = {"auth/email-already-in-use":"이미 사용중인 이메일입니다.","auth/invalid-email":"이메일 형식이 올바르지 않습니다."};
        err.textContent = msgs[e.code]||"오류가 발생했습니다.";
        sb.textContent = "계정 만들기";
      }
    },"white","lg",{width:"100%"});
    w.appendChild(nf); w.appendChild(ef); w.appendChild(pf); w.appendChild(err); w.appendChild(sb);
    return w;
  };

  // 회원 폼
  const memberForm = () => {
    const w = el("div",{});
    const tf = fld("트레이너 이메일"); const ti = inp({type:"email",placeholder:"트레이너 이메일 입력"}); tf.appendChild(ti);
    const sb = btn("회원 목록 불러오기",()=>{},"outline","md",{width:"100%",marginBottom:"14px"});
    const mArea = el("div",{});
    const err = el("p",{color:T.red,fontSize:"13px",marginBottom:"12px",textAlign:"center",minHeight:"18px"},"");

    sb.addEventListener("click", async()=>{
      err.textContent=""; mArea.innerHTML="";
      sb.innerHTML=`<span class="spin">⟳</span> 검색 중...`;
      try {
        const tSnap = await db.collection("trainers").where("email","==",ti.value.trim()).get();
        if (tSnap.empty) { err.textContent="트레이너를 찾을 수 없습니다."; sb.textContent="회원 목록 불러오기"; return; }
        const tid = tSnap.docs[0].id;
        const mSnap = await db.collection("members").where("trainerId","==",tid).get();
        if (mSnap.empty) { err.textContent="등록된 회원이 없습니다."; sb.textContent="회원 목록 불러오기"; return; }

        const mf = fld("회원 선택");
        const ms = sel([{v:"",l:"이름을 선택하세요"},...mSnap.docs.map(d=>({v:d.id,l:d.data().name}))]);
        mf.appendChild(ms); mArea.appendChild(mf);

        const eb = btn("입장하기",async()=>{
          if (!ms.value) { err.textContent="회원을 선택해주세요."; return; }
          STATE.role="member"; STATE.myMemberId=ms.value; STATE.tab="workout";
          await loadMemberData(ms.value); render();
        },"white","lg",{width:"100%"});
        mArea.appendChild(eb);
        sb.textContent="회원 목록 불러오기";
      } catch(e) { err.textContent="오류가 발생했습니다."; sb.textContent="회원 목록 불러오기"; }
    });

    w.appendChild(tf); w.appendChild(sb); w.appendChild(err); w.appendChild(mArea);
    return w;
  };

  const updateForm = () => {
    formArea.innerHTML="";
    if (mode==="login") formArea.appendChild(loginForm());
    else if (mode==="signup") formArea.appendChild(signupForm());
    else formArea.appendChild(memberForm());
  };
  updateForm();

  box.appendChild(logo); box.appendChild(tabWrap); box.appendChild(formArea);
  wrap.appendChild(box); root.appendChild(wrap);
}

// ════════════════════════════════
// 메인 렌더
// ════════════════════════════════
function render() {
  if (!STATE.role) { renderAuth(); return; }
  const root = $("app"); root.innerHTML="";
  const isT = STATE.role==="trainer";
  const myMember = STATE.members.find(x=>x.id===STATE.myMemberId);

  // 헤더
  const hdr = el("div",{background:T.bg,borderBottom:`1px solid ${T.border}`,padding:"13px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:"0",zIndex:"200"});
  hdr.innerHTML = `<div style="display:flex;align-items:center;gap:11px"><div style="width:32px;height:32px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px">◼</div><div><p style="font-family:'Playfair Display',serif;font-size:15px;color:#fff;line-height:1.1">PT Manager</p><p style="font-size:10px;color:${T.text3};margin-top:1px">${isT?(auth.currentUser?.displayName||"트레이너")+" · TRAINER":(myMember?.name||"")+" · MEMBER"}</p></div></div>`;
  hdr.appendChild(btn("로그아웃", async()=>{
    STATE.unsubs.forEach(u=>u()); STATE.unsubs=[];
    if (isT) { await auth.signOut(); }
    else { STATE.role=null; STATE.myMemberId=null; STATE.members=[]; STATE.logs=[]; STATE.diets=[]; STATE.schedules=[]; render(); }
  },"ghost","sm"));

  // 콘텐츠
  const content = el("div",{padding:"28px 18px 110px",maxWidth:"600px",margin:"0 auto"});
  content.className="a0";

  if (STATE.tab==="dash"&&isT) content.appendChild(renderDash());
  else if (STATE.tab==="members"&&isT) content.appendChild(renderMembers());
  else if (STATE.tab==="workout") content.appendChild(renderWorkout());
  else if (STATE.tab==="diet_review"&&isT) content.appendChild(renderDietReview());
  else if (STATE.tab==="diet"&&!isT) content.appendChild(renderDietMember());
  else if (STATE.tab==="weight"&&!isT) content.appendChild(renderWeight());
  else if (STATE.tab==="schedule") content.appendChild(renderSchedule());

  // 탭바
  const TABS = isT

        row.appendChild(el("span",{fontSize:"14px",color:"#d0d0d0"},it.food));
        row.appendChild(el("span",{fontFamily:"'Playfair Display',serif",fontSize:"14px",color:T.text2},`${it.kcal} kcal`));
        mw.appendChild(row);
      });
      c.appendChild(mw);
    });
    c.appendChild(divider(14));
    const tgs=el("div",{display:"flex",gap:"10px",flexWrap:"wrap"});
    tgs.appendChild(tag(`💧 ${d.water}L`));tgs.appendChild(tag(`☕ 커피 ${d.coffee}잔`));c.appendChild(tgs);
    if(d.trainerRating>0){
      const fb=el("div",{marginTop:"14px",background:T.surface2,borderRadius:"12px",padding:"14px 16px"});
      const fbt=el("div",{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:d.trainerComment?"10px":"0"});
      fbt.appendChild(el("p",{fontSize:"11px",color:T.text3,letterSpacing:"0.07em"},"TRAINER FEEDBACK"));
      fbt.appendChild(stars(d.trainerRating,null,15));fb.appendChild(fbt);
      if(d.trainerComment)fb.appendChild(el("p",{fontSize:"13px",color:T.text2,lineHeight:"1.7"},d.trainerComment));
      c.appendChild(fb);
    }
    wrap.appendChild(c);
  });

  const addModal=()=>{
    const cnt=el("div",{});
    const TIMES=["아침","점심","저녁","간식"];
    let meals=[{time:"아침",items:[{food:"",kcal:""}]},{time:"점심",items:[{food:"",kcal:""}]},{time:"저녁",items:[{food:"",kcal:""}]}];
    const grid=el("div",{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"});
    const df=fld("날짜");df.style.gridColumn="1/-1";const di=inp({type:"date",value:today()});df.appendChild(di);
    const wf=fld("수분 (L)");const wi=inp({type:"number",step:"0.5",placeholder:"2.0"});wf.appendChild(wi);
    const cf=fld("커피 (잔)");const ci=inp({type:"number",placeholder:"1"});cf.appendChild(ci);
    grid.appendChild(df);grid.appendChild(wf);grid.appendChild(cf);cnt.appendChild(grid);
    cnt.appendChild(divider());
    const aiRow=el("div",{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"});
    aiRow.appendChild(lbl("끼니별 식단"));
    const aiBtn=el("button",{background:"#fff",color:"#000",border:"none",borderRadius:"9px",padding:"8px 16px",cursor:"pointer",fontSize:"12px",fontWeight:"700",display:"flex",alignItems:"center",gap:"6px"},"✦ AI 칼로리 자동계산");
    aiRow.appendChild(aiBtn);cnt.appendChild(aiRow);
    cnt.appendChild(el("p",{fontSize:"11px",color:T.text4,marginBottom:"16px"},"음식명 입력 시 자동으로 kcal이 채워집니다."));
    const mealArea=el("div",{});cnt.appendChild(mealArea);

    const drawMeals=()=>{
      mealArea.innerHTML="";
      meals.forEach((meal,mi)=>{
        const mw=el("div",{marginBottom:"20px"});
        mw.appendChild(el("p",{fontSize:"12px",color:T.text2,marginBottom:"10px"},`${ICON[meal.time]} ${meal.time}`));
        meal.items.forEach((it,ii)=>{
          const row=el("div",{display:"grid",gridTemplateColumns:"3fr 1fr",gap:"8px",marginBottom:"8px"});
          const fi=inp({type:"text",placeholder:"음식명 (예: 닭가슴살)"},{padding:"10px 12px"});
          fi.value=it.food;
          const ki=inp({type:"number",placeholder:"kcal"},{padding:"10px",color:it.kcal?T.green:T.text3});
          ki.value=it.kcal||"";
          fi.addEventListener("input",e=>{const k=findKcal(e.target.value);meals[mi].items[ii].food=e.target.value;if(k!==null){meals[mi].items[ii].kcal=k;ki.value=k;ki.style.color=T.green;}});
          ki.addEventListener("input",e=>meals[mi].items[ii].kcal=+e.target.value);
          row.appendChild(fi);row.appendChild(ki);mw.appendChild(row);
        });
        const ab=el("button",{background:"none",border:"none",color:T.text4,fontSize:"12px",cursor:"pointer",padding:"0"},"+ 음식 추가");
        ab.addEventListener("click",()=>{meals[mi].items.push({food:"",kcal:""});drawMeals();});
        mw.appendChild(ab);mealArea.appendChild(mw);
      });
    };
    drawMeals();

    aiBtn.addEventListener("click",async()=>{
      const foods=meals.flatMap(m=>m.items.map(it=>it.food)).filter(Boolean);
      if(!foods.length){toast("음식을 먼저 입력해주세요",false);return;}
      aiBtn.innerHTML=`<span class="spin">⟳</span> 계산 중...`;
      try{
        const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:500,messages:[{role:"user",content:`다음 음식 1인분 칼로리를 JSON으로만 반환. 키=음식명, 값=정수: ${foods.join(", ")}`}]})});
        const data=await r.json();
        const raw=data.content?.map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
        const parsed=JSON.parse(raw);
        meals.forEach(meal=>meal.items.forEach(it=>{if(!it.food)return;const k=Object.keys(parsed).find(k=>k.includes(it.food)||it.food.includes(k));if(k)it.kcal=parsed[k];}));
        drawMeals();toast("칼로리 계산 완료!");
      }catch{meals.forEach(meal=>meal.items.forEach(it=>{const k=findKcal(it.food);if(k!==null)it.kcal=k;}));drawMeals();}
      aiBtn.innerHTML="✦ AI 칼로리 자동계산";
    });

    const tot=()=>meals.reduce((a,m)=>a+m.items.reduce((b,it)=>b+(+it.kcal||0),0),0);
    const sb=btn("저장하기",async()=>{
      const valid=meals.map(m=>({...m,items:m.items.filter(it=>it.food)})).filter(m=>m.items.length>0);
      if(!valid.length){toast("식단을 입력해주세요",false);return;}
      const total=valid.reduce((a,m)=>a+m.items.reduce((b,it)=>b+(+it.kcal||0),0),0);
      sb.innerHTML=`<span class="spin">⟳</span> 저장 중...`;
      const m=STATE.members.find(x=>x.id===STATE.myMemberId);
      try{await addDoc2("diets",{trainerId:m?.trainerId,memberId:STATE.myMemberId,date:di.value,meals:valid,water:+wi.value,coffee:+ci.value,totalKcal:total,trainerRating:0,trainerComment:""});toast("식단 저장 완료!");document.querySelector(".ov")?.remove();}
      catch(e){toast("오류가 발생했습니다",false);sb.textContent="저장하기";}
    },"white","lg",{width:"100%"});
    cnt.appendChild(sb);
    modal("식단 기록",cnt,true);
  };
  return wrap;
}

// ── 식단 검토 (트레이너)
function renderDietReview() {
  const wrap=el("div",{});
  const ICON={아침:"🌅",점심:"☀️",저녁:"🌙",간식:"🍎"};
  let filter="all", editId=null;

  const draw=()=>{
    wrap.innerHTML="";
    wrap.appendChild(pageHdr("Diet Review","식단 검토"));
    const fw=el("div",{display:"flex",gap:"8px",marginBottom:"22px",overflowX:"auto",paddingBottom:"4px"});
    [{id:"all",name:"전체"},...STATE.members].forEach(m=>{
      const active=filter===(m.id==="all"?"all":m.id);
      const b=el("button",{padding:"7px 16px",borderRadius:"99px",border:`1px solid ${active?"#fff":T.border2}`,background:active?"#fff":"transparent",color:active?"#000":T.text3,fontSize:"13px",fontWeight:"600",cursor:"pointer",whiteSpace:"nowrap"},m.name);
      b.addEventListener("click",()=>{filter=m.id==="all"?"all":m.id;draw();});fw.appendChild(b);
    });
    wrap.appendChild(fw);
    const shown=[...(filter==="all"?STATE.diets:STATE.diets.filter(d=>d.memberId===filter))].sort((a,b)=>b.date.localeCompare(a.date));
    if(!shown.length){wrap.appendChild(el("p",{color:T.text4,fontSize:"14px",textAlign:"center",padding:"60px 0"},"식단 기록이 없습니다"));return;}
    shown.forEach(d=>{
      const m=STATE.members.find(x=>x.id===d.memberId);
      const c=card({marginBottom:"12px"});
      const top=el("div",{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"18px"});
      const tl=el("div",{});
      tl.appendChild(el("p",{fontFamily:"'Playfair Display',serif",fontSize:"19px",color:T.text,marginBottom:"3px"},m?.name||""));
      tl.appendChild(el("p",{fontSize:"12px",color:T.text3},d.date));
      const kc=el("div",{textAlign:"right"});
      kc.appendChild(el("p",{fontFamily:"'Playfair Display',serif",fontSize:"24px",color:T.text},d.totalKcal.toLocaleString()));
      kc.appendChild(el("p",{fontSize:"10px",color:T.text3,letterSpacing:"0.07em"},"KCAL"));
      top.appendChild(tl);top.appendChild(kc);c.appendChild(top);
      d.meals.forEach(meal=>{
        const mw=el("div",{marginBottom:"13px"});
        mw.appendChild(el("p",{fontSize:"11px",color:T.text3,letterSpacing:"0.07em",marginBottom:"8px"},`${ICON[meal.time]||"🍽"} ${meal.time.toUpperCase()}`));
        meal.items.forEach(it=>{const row=el("div",{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:`1px solid ${T.surface2}`});row.appendChild(el("span",{fontSize:"14px",color:"#d0d0d0"},it.food));row.appendChild(el("span",{fontFamily:"'Playfair Display',serif",fontSize:"14px",color:T.text2},`${it.kcal} kcal`));mw.appendChild(row);});
        c.appendChild(mw);
      });
      c.appendChild(divider(14));
      const tgs=el("div",{display:"flex",gap:"10px",flexWrap:"wrap",marginBottom:"16px"});
      tgs.appendChild(tag(`💧 ${d.water}L`));tgs.appendChild(tag(`☕ 커피 ${d.coffee}잔`));c.appendChild(tgs);
      c.appendChild(divider(0));
      const ea=el("div",{paddingTop:"16px"});
      if(editId!==d.id){
        const er=el("div",{display:"flex",justifyContent:"space-between",alignItems:"flex-start"});
        const left=el("div",{});
        if(d.trainerRating>0){left.appendChild(stars(d.trainerRating,null,18));if(d.trainerComment)left.appendChild(el("p",{fontSize:"13px",color:T.text2,marginTop:"8px",lineHeight:"1.7",maxWidth:"300px"},d.trainerComment));}
        else left.appendChild(el("p",{fontSize:"12px",color:T.text4},"피드백 미작성"));
        er.appendChild(left);er.appendChild(btn(d.trainerRating>0?"수정":"평가하기",()=>{editId=d.id;draw();},"ghost","sm"));ea.appendChild(er);
      } else {
        let sv=d.trainerRating||0;
        ea.appendChild(el("p",{fontSize:"11px",color:T.text3,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"14px"},"식단 평가"));
        const sw=el("div",{marginBottom:"16px"});
        const drawS=()=>{sw.innerHTML="";sw.appendChild(stars(sv,v=>{sv=v;drawS();},30));};drawS();ea.appendChild(sw);
        const ct=ta("피드백 입력",{marginBottom:"12px"});ct.value=d.trainerComment||"";ea.appendChild(ct);
        const br=el("div",{display:"flex",gap:"8px"});
        const sb=btn("저장",async()=>{sb.innerHTML=`<span class="spin">⟳</span>`;try{await updateDoc2("diets",d.id,{trainerRating:sv,trainerComment:ct.value});editId=null;toast("피드백 저장 완료!");}catch{toast("오류가 발생했습니다",false);}},  "white","md",{flex:"1"});
        br.appendChild(sb);br.appendChild(btn("취소",()=>{editId=null;draw();},"ghost","md"));ea.appendChild(br);
      }
      c.appendChild(ea);wrap.appendChild(c);
    });
  };
  draw();return wrap;
}

// ── 체중 (회원)
function renderWeight() {
  const wrap=el("div",{});
  wrap.appendChild(pageHdr("Weight Tracking","체중 기록"));
  const m=STATE.members.find(x=>x.id===STATE.myMemberId);
  if(!m){wrap.appendChild(el("p",{color:T.text4},"불러오는 중..."));return wrap;}
  const wLog=m.weightLog||[],w0=wLog[0]?.w,wN=wLog.at(-1)?.w;
  const diff=wLog.length>=2?(wN-w0).toFixed(1):null;
  const c=card({marginBottom:"14px"});c.appendChild(lbl("나의 체중 변화"));
  const grid=el("div",{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginTop:"14px",marginBottom:"20px"});
  [["시작",`${w0}kg`],["현재",`${wLog.at(-1)?.w}kg`],["변화",diff!==null?`${+diff>0?"+":""}${diff}kg`:"—"]].forEach(([k,v])=>{
    const cell=el("div",{background:T.surface2,borderRadius:"12px",padding:"16px 12px",textAlign:"center"});
    cell.appendChild(el("p",{fontSize:"10px",color:T.text4,marginBottom:"8px"},k));
    cell.appendChild(el("p",{fontFamily:"'Playfair Display',serif",fontSize:"22px",color:k==="변화"&&diff!==null?(+diff<0?T.green:+diff>0?T.red:T.text):T.text},v));
    grid.appendChild(cell);
  });
  c.appendChild(grid);
  c.appendChild(el("p",{fontSize:"11px",color:T.text3,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"12px"},"기록 내역"));
  [...wLog].reverse().slice(0,8).forEach(entry=>{
    const row=el("div",{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:`1px solid ${T.border}`});
    row.appendChild(el("span",{fontSize:"13px",color:T.text3},entry.date));
    row.appendChild(el("span",{fontFamily:"'Playfair Display',serif",fontSize:"18px",color:T.text},`${entry.w} kg`));
    c.appendChild(row);
  });
  wrap.appendChild(c);
  const ic=card();ic.appendChild(lbl("오늘 체중 입력"));
  const ir=el("div",{display:"flex",gap:"10px",marginTop:"14px"});
  const wi=inp({type:"number",step:"0.1",placeholder:"59.5"},{flex:"1",fontSize:"22px",textAlign:"center"});
  const sb=btn("저장",async()=>{
    if(!wi.value){toast("체중을 입력해주세요",false);return;}
    const val=+wi.value,td=today();
    sb.innerHTML=`<span class="spin">⟳</span>`;
    try{const nl=[...(m.weightLog||[]),{date:td,w:val}];await updateDoc2("members",STATE.myMemberId,{weightLog:nl,weight:val});wi.value="";toast("체중 저장 완료! ✓");}
    catch(e){toast("오류가 발생했습니다",false);}
    sb.textContent="저장";
  },"white","md");
  ir.appendChild(wi);ir.appendChild(sb);ic.appendChild(ir);
  ic.appendChild(el("p",{fontSize:"11px",color:T.text4,textAlign:"center",marginTop:"14px"},"입력하면 트레이너가 실시간으로 확인합니다"));
  wrap.appendChild(ic);return wrap;
}

// ── 일정
function renderSchedule() {
  const wrap=el("div",{});
  const isT=STATE.role==="trainer";
  wrap.appendChild(pageHdr("Schedule","PT 일정",!isT?null:btn("+ 일정 추가",()=>addModal(),"white","md")));
  const list=isT?STATE.schedules:STATE.schedules.filter(s=>s.memberId===STATE.myMemberId);
  const upcoming=[...list.filter(s=>s.status==="예정")].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const done=[...list.filter(s=>s.status==="완료")].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const mkRow=(s,can)=>{
    const m=STATE.members.find(x=>x.id===s.memberId);
    const row=el("div",{display:"flex",alignItems:"center",gap:"14px",padding:"13px 0",borderBottom:`1px solid ${T.border}`});
    const tm=el("div",{background:T.surface2,borderRadius:"10px",padding:"9px 14px",minWidth:"58px",textAlign:"center"});
    tm.appendChild(el("p",{fontFamily:"'Playfair Display',serif",fontSize:"17px",color:T.text},s.time));
    tm.appendChild(el("p",{fontSize:"10px",color:T.text4,marginTop:"2px"},s.date.slice(5)));
    const info=el("div",{flex:"1"});
    info.appendChild(el("p",{fontSize:"15px",fontWeight:"600",color:T.text},m?.name||""));
    info.appendChild(el("p",{fontSize:"12px",color:T.text3,marginTop:"2px"},`${s.duration}분`));
    row.appendChild(tm);row.appendChild(info);
    if(can)row.appendChild(btn("완료",async()=>{await updateDoc2("schedules",s.id,{status:"완료"});toast("완료 처리!");},"outline","sm"));
    else{const b=el("span",{fontSize:"11px",color:T.green,background:"#0b1f14",border:"1px solid #1a3528",borderRadius:"99px",padding:"4px 11px"},"완료");row.appendChild(b);}
    return row;
  };
  const uc=card({marginBottom:"14px"});
  const uh=el("div",{display:"flex",justifyContent:"space-between",marginBottom:"16px"});
  uh.appendChild(lbl("예정된 일정"));uh.appendChild(tag(`${upcoming.length}건`));uc.appendChild(uh);
  if(!upcoming.length)uc.appendChild(el("p",{color:T.text4,fontSize:"14px",padding:"16px 0"},"예정된 일정이 없습니다"));
  else upcoming.forEach(s=>uc.appendChild(mkRow(s,isT)));
  wrap.appendChild(uc);
  const dc=card();
  const dh=el("div",{display:"flex",justifyContent:"space-between",marginBottom:"16px"});
  dh.appendChild(lbl("완료된 세션"));dh.appendChild(tag(`${done.length}건`));dc.appendChild(dh);
  if(!done.length)dc.appendChild(el("p",{color:T.text4,fontSize:"14px",padding:"16px 0"},"완료된 세션이 없습니다"));
  else done.forEach(s=>dc.appendChild(mkRow(s,false)));
  wrap.appendChild(dc);

  const addModal=()=>{
    const cnt=el("div",{});
    const mf=fld("회원");const ms=sel([{v:"",l:"회원 선택"},...STATE.members.map(m=>({v:m.id,l:m.name}))]);mf.appendChild(ms);cnt.appendChild(mf);
    const grid=el("div",{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"});
    const df=fld("날짜");const di=inp({type:"date",value:today()});df.appendChild(di);
    const tf=fld("시간");const ti=inp({type:"time",value:"10:00"});tf.appendChild(ti);
    const duf=fld("세션 시간 (분)");const dui=inp({type:"number",value:"60"});duf.appendChild(dui);
    grid.appendChild(df);grid.appendChild(tf);grid.appendChild(duf);cnt.appendChild(grid);
    const sb=btn("일정 추가",async()=>{
      if(!ms.value){toast("회원을 선택해주세요",false);return;}
      sb.innerHTML=`<span class="spin">⟳</span> 저장 중...`;
      try{await addDoc2("schedules",{trainerId:uid(),memberId:ms.value,date:di.value,time:ti.value,duration:+dui.value,status:"예정"});toast("일정 추가 완료!");document.querySelector(".ov")?.remove();}
      catch(e){toast("오류가 발생했습니다",false);sb.textContent="일정 추가";}
    },"white","lg",{width:"100%"});
    cnt.appendChild(sb);modal("PT 일정 추가",cnt);
  };
  return wrap;
}

  if (user) {

    loadTrainerData();
    render();
  } else {
    if (STATE.role !== "member") {
      STATE.role = null;
      render();
    }
  }
});
