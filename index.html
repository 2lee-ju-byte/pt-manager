function guessKcal(n) {
  if (!n) return null;
  var s = n.trim().replace(/\s+/g,"").toLowerCase();
  var keys = Object.keys(KCAL);
  for (var i=0; i<keys.length; i++) {
    if (s.includes(keys[i]) || keys[i].includes(s)) return KCAL[keys[i]];

  return null;
}

/* ── Firebase 헬퍼 */
function dbAdd(col, data) {
  return db.collection(col).add(Object.assign({}, data, {
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }));
}
function dbUpdate(col, id, data) {
  return db.collection(col).doc(id).update(data);
}
function dbSet(col, id, data) {
  return db.collection(col).doc(id).set(data, {merge:true});
}
function getUid() {
  return auth.currentUser ? auth.currentUser.uid : null;
}

/* ── 데이터 로드 */
function loadTrainer() {
  APP.unsubs.forEach(function(u){u();});
  APP.unsubs = [];
  var tid = getUid();
  APP.unsubs.push(
    db.collection("members").where("trainerId","==",tid)
      .onSnapshot(function(s){ APP.members = s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderApp(); }),
    db.collection("logs").where("trainerId","==",tid)
      .onSnapshot(function(s){ APP.logs = s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderApp(); }),
    db.collection("diets").where("trainerId","==",tid)
      .onSnapshot(function(s){ APP.diets = s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderApp(); }),
    db.collection("schedules").where("trainerId","==",tid)
      .onSnapshot(function(s){ APP.schedules = s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderApp(); }),
    db.collection("resources").where("trainerId","==",tid)
      .onSnapshot(function(s){ APP.resources = s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderApp(); })
  );
}

function loadMember(mid) {
  APP.unsubs.forEach(function(u){u();});
  APP.unsubs = [];
  return db.collection("members").doc(mid).get().then(function(doc) {
    if (doc.exists) {
      APP.members = [Object.assign({id:doc.id}, doc.data())];
      var tid = doc.data().trainerId;
      APP.unsubs.push(
        db.collection("logs").where("memberId","==",mid)
          .onSnapshot(function(s){ APP.logs = s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderApp(); }),
        db.collection("diets").where("memberId","==",mid)
          .onSnapshot(function(s){ APP.diets = s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderApp(); }),
        db.collection("schedules").where("memberId","==",mid)
          .onSnapshot(function(s){ APP.schedules = s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderApp(); }),
        db.collection("resources").where("trainerId","==",tid)
          .onSnapshot(function(s){ APP.resources = s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); renderApp(); })
      );
    }
  });
}

/* ══════════════════════════════

var INP_STYLE = {
  width:"100%", padding:"11px 14px",
  background:C.card, border:"1.5px solid "+C.b2,
  borderRadius:"10px", color:C.t1, fontSize:"14px", outline:"none"
};

function mk(tag, props, children) {
  var el = document.createElement(tag);
  if (props) {
    if (props.style) Object.assign(el.style, props.style);
    if (props.class) el.className = props.class;
    if (props.html) el.innerHTML = props.html;
    if (props.text) el.textContent = props.text;
    Object.keys(props).forEach(function(k) {
      if (k !== "style" && k !== "class" && k !== "html" && k !== "text") {
        var v = props[k];
        if (typeof v === "function") el.addEventListener(k, v);
        else if (k !== "style" && k !== "class") el.setAttribute(k, v);
      }
    });
  }
  if (children) {
    (Array.isArray(children) ? children : [children]).forEach(function(c) {
      if (c) el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
  }
  return el;
}

function div(sx, children) {
  var el = document.createElement("div");
  if (sx) Object.assign(el.style, sx);
  if (children) {
    (Array.isArray(children) ? children : [children]).forEach(function(c) {
      if (c) el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
  }
  return el;
}

function p(sx, text) {
  var el = document.createElement("p");
  if (sx) Object.assign(el.style, sx);
  el.textContent = text || "";
  return el;
}

function span(sx, text) {
  var el = document.createElement("span");
  if (sx) Object.assign(el.style, sx);
  el.textContent = text || "";
  return el;
}

function mkBtn(label, onClick, variant, size) {
  variant = variant || "dark";
  size = size || "md";
  var styles = {
    dark: {background:C.black, color:"#fff", border:"none"},
    light: {background:C.card, color:C.t1, border:"1.5px solid "+C.b2},
    ghost: {background:C.s2, color:C.t2, border:"1.5px solid "+C.b1},
    success: {background:C.gbg, color:C.green, border:"1.5px solid #86efac"},
    danger: {background:C.rbg, color:C.red, border:"1.5px solid #fca5a5"}
  };
  var sizes = {
    sm: {padding:"6px 14px", fontSize:"12px"},
    md: {padding:"10px 20px", fontSize:"14px"},
    lg: {padding:"13px 26px", fontSize:"15px"}
  };
  var btn = document.createElement("button");
  Object.assign(btn.style, {
    display:"inline-flex", alignItems:"center", justifyContent:"center", gap:"6px",
    cursor:"pointer", fontWeight:"600", borderRadius:"10px", transition:"opacity .15s",
    fontFamily:"'Noto Sans KR',sans-serif"
  }, styles[variant] || styles.dark, sizes[size] || sizes.md);
  btn.innerHTML = label;
  btn.addEventListener("click", onClick);
  btn.addEventListener("mouseenter", function(){ btn.style.opacity="0.8"; });
  btn.addEventListener("mouseleave", function(){ btn.style.opacity="1"; });
  return btn;
}

function mkCard(sx) {
  return div(Object.assign({background:C.card, border:"1.5px solid "+C.b1, borderRadius:"14px", padding:"20px"}, sx));
}

function mkLabel(text) {
  return p({fontSize:"11px", fontWeight:"700", color:C.t3, letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:"8px"}, text);
}

function mkTag(text, color) {
  color = color || "gray";
  var colors = {
    gray: {bg:C.s2, fg:C.t3, bd:C.b1},
    green: {bg:C.gbg, fg:C.green, bd:"#86efac"},
    red: {bg:C.rbg, fg:C.red, bd:"#fca5a5"},
    blue: {bg:C.bbg, fg:C.blue, bd:"#93c5fd"}
  };
  var col = colors[color] || colors.gray;
  var s = document.createElement("span");
  Object.assign(s.style, {fontSize:"11px", fontWeight:"600", background:col.bg, color:col.fg, border:"1px solid "+col.bd, borderRadius:"99px", padding:"3px 10px", whiteSpace:"nowrap"});
  s.textContent = text;
  return s;
}

function mkBar(val, max, color) {
  color = color || C.black;
  var pct = max > 0 ? Math.min(Math.round(val/max*100), 100) : 0;
  var wrap = div({background:C.s3, borderRadius:"99px", height:"6px", overflow:"hidden"});
  wrap.appendChild(div({width:pct+"%", background:color, height:"100%", borderRadius:"99px", transition:"width .6s ease"}));
  return wrap;
}

function mkDivider(my) {
  my = my || 16;
  return div({borderTop:"1.5px solid "+C.b1, margin:my+"px 0"});
}

function mkStars(val, onChange, size) {
  size = size || 20;
  var wrap = div({display:"flex", gap:"3px"});
  [1,2,3,4,5].forEach(function(n) {
    var s = document.createElement("span");
    s.textContent = "★";
    Object.assign(s.style, {fontSize:size+"px", cursor:onChange?"pointer":"default", color:n<=val?"#f59e0b":"#ddd", transition:"color .15s"});
    if (onChange) s.addEventListener("click", function(){ onChange(n); });
    wrap.appendChild(s);
  });
  return wrap;
}

function mkInput(attrs, sx) {
  var i = document.createElement("input");
  Object.assign(i.style, INP_STYLE, sx || {});
  Object.entries(attrs || {}).forEach(function(e){ i.setAttribute(e[0], e[1]); });
  i.addEventListener("focus", function(){ i.style.borderColor = C.black; });
  i.addEventListener("blur", function(){ i.style.borderColor = C.b2; });
  return i;
}

function mkSelect(options, val, sx) {
  var s = document.createElement("select");
  Object.assign(s.style, INP_STYLE, sx || {});
  options.forEach(function(o) {
    var op = document.createElement("option");
    op.value = o.v !== undefined ? o.v : o;
    op.textContent = o.l !== undefined ? o.l : o;
    if (op.value === (val||"")) op.selected = true;
    s.appendChild(op);
  });
  return s;
}

function mkTextarea(ph, sx) {
  var t = document.createElement("textarea");
  Object.assign(t.style, INP_STYLE, {minHeight:"76px", resize:"vertical"}, sx||{});
  t.placeholder = ph || "";
  return t;
}

function mkField(label) {
  var w = div({marginBottom:"14px"});
  if (label) {
    var l = document.createElement("label");
    Object.assign(l.style, {display:"block", fontSize:"12px", fontWeight:"700", color:C.t2, marginBottom:"6px"});
    l.textContent = label;
    w.appendChild(l);
  }
  return w;
}

function mkModal(title, content, wide) {
  var ov = div({position:"fixed", inset:"0", background:"rgba(0,0,0,.4)", zIndex:"999", display:"flex", alignItems:"center", justifyContent:"center", padding:"16px"});
  ov.className = "ov";
  ov.addEventListener("click", function(e){ if(e.target===ov) ov.remove(); });

  var box = div({background:C.card, borderRadius:"18px", padding:"28px", width:"100%", maxWidth:wide?"560px":"460px", maxHeight:"90vh", overflowY:"auto", boxShadow:"0 20px 60px rgba(0,0,0,.12)"});
  box.className = "au";

  var hd = div({display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"22px"});
  var ttl = document.createElement("h3");
  Object.assign(ttl.style, {fontFamily:"'Noto Serif KR',serif", fontSize:"20px", fontWeight:"700", color:C.t1});
  ttl.textContent = title;
  var cls = mkBtn("×", function(){ ov.remove(); }, "ghost", "sm");
  cls.style.width = "32px"; cls.style.height = "32px"; cls.style.padding = "0";
  hd.appendChild(ttl); hd.appendChild(cls);
  box.appendChild(hd); box.appendChild(content);
  ov.appendChild(box); document.body.appendChild(ov);
  return ov;
}

function showToast(msg, ok) {
  ok = ok !== false;
  var t = div({position:"fixed", bottom:"90px", left:"50%", transform:"translateX(-50%)", background:ok?"#111":"#dc2626", color:"#fff", borderRadius:"99px", padding:"10px 20px", fontSize:"13px", fontWeight:"600", zIndex:"9999", whiteSpace:"nowrap", boxShadow:"0 4px 20px rgba(0,0,0,.2)"});
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2500);
}

function pageHeader(sub, title, action) {
  var w = div({display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:"24px"});
  var left = div({});
  left.appendChild(p({fontSize:"11px", color:C.t3, letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:"4px"}, sub));

  Object.assign(h2.style, {fontFamily:"'Noto Serif KR',serif", fontSize:"26px", fontWeight:"700", color:C.t1});
  h2.textContent = title;
  left.appendChild(h2);
  w.appendChild(left);
  if (action) w.appendChild(action);
  return w;
}

/* ── 인증 모달 */
function showAuthModal(defaultMode) {
  var mode = defaultMode || "login";
  var cnt = div({});

  // 탭
  var tabWrap = div({display:"flex", gap:"8px", marginBottom:"22px"});
  var tabDefs = [{m:"login",l:"트레이너 로그인"},{m:"signup",l:"트레이너 가입"},{m:"member",l:"회원 입장"}];
  var tabBtns = {};
  tabDefs.forEach(function(t) {
    var b = document.createElement("button");
    Object.assign(b.style, {flex:"1", padding:"9px 4px", borderRadius:"10px", border:"none", cursor:"pointer", fontSize:"11px", fontWeight:"700", transition:"all .15s", fontFamily:"'Noto Sans KR',sans-serif"});
    b.textContent = t.l;
    b.addEventListener("click", function(){ mode = t.m; refreshTabs(); refreshForm(); });
    tabWrap.appendChild(b);
    tabBtns[t.m] = b;
  });
  function refreshTabs() {
    tabDefs.forEach(function(t) {
      var b = tabBtns[t.m];
      if (t.m === mode) {
        Object.assign(b.style, {background:C.black, color:"#fff", border:"none"});
      } else {
        Object.assign(b.style, {background:C.s2, color:C.t2, border:"1.5px solid "+C.b1});
      }
    });
  }
  refreshTabs();
  cnt.appendChild(tabWrap);

  var formArea = div({});
  cnt.appendChild(formArea);

  function refreshForm() {
    formArea.innerHTML = "";
    if (mode === "login") formArea.appendChild(buildLoginForm());
    else if (mode === "signup") formArea.appendChild(buildSignupForm());
    else formArea.appendChild(buildMemberForm());
  }

  /* 트레이너 로그인 */
  function buildLoginForm() {
    var w = div({});
    var ef = mkField("이메일"); var ei = mkInput({type:"email", placeholder:"trainer@email.com"}); ef.appendChild(ei);
    var pf = mkField("비밀번호"); var pi = mkInput({type:"password", placeholder:"••••••••"}); pf.appendChild(pi);
    var err = p({color:C.red, fontSize:"13px", marginBottom:"12px", minHeight:"18px"}, "");
    var lb = mkBtn("로그인", function() {
      err.textContent = ""; lb.innerHTML = '<span class="sp">⟳</span> 로그인 중...';
      auth.signInWithEmailAndPassword(ei.value.trim(), pi.value)
        .then(function() { document.querySelector(".ov") && document.querySelector(".ov").remove(); })
        .catch(function(e) { err.textContent = "이메일 또는 비밀번호를 확인해주세요."; lb.textContent = "로그인"; });
    }, "dark", "lg");
    lb.style.width = "100%";
    w.appendChild(ef); w.appendChild(pf); w.appendChild(err); w.appendChild(lb);
    return w;
  }

  /* 트레이너 가입 */
  function buildSignupForm() {
    var w = div({});
    var nf = mkField("트레이너 이름"); var ni = mkInput({type:"text", placeholder:"홍길동 트레이너"}); nf.appendChild(ni);
    var ef = mkField("이메일"); var ei = mkInput({type:"email", placeholder:"trainer@email.com"}); ef.appendChild(ei);
    var pf = mkField("비밀번호 (6자리 이상)"); var pi = mkInput({type:"password", placeholder:"••••••••"}); pf.appendChild(pi);
    var err = p({color:C.red, fontSize:"13px", marginBottom:"12px", minHeight:"18px"}, "");
    var sb = mkBtn("계정 만들기", function() {
      err.textContent = "";
      if (!ni.value.trim()) { err.textContent = "이름을 입력해주세요."; return; }
      if (pi.value.length < 6) { err.textContent = "비밀번호는 6자리 이상이어야 합니다."; return; }
      sb.innerHTML = '<span class="sp">⟳</span> 생성 중...';
      auth.createUserWithEmailAndPassword(ei.value.trim(), pi.value)
        .then(function(cred) {
          return cred.user.updateProfile({displayName: ni.value.trim()})
            .then(function() {
              return dbSet("trainers", cred.user.uid, {name:ni.value.trim(), email:ei.value.trim(), createdAt:new Date().toISOString()});
            });
        })
        .then(function() {
          document.querySelector(".ov") && document.querySelector(".ov").remove();
          showToast("가입 완료! 환영합니다 💪");
        })
        .catch(function(e) {
          var msgs = {"auth/email-already-in-use":"이미 사용중인 이메일입니다.", "auth/invalid-email":"이메일 형식을 확인해주세요."};
          err.textContent = msgs[e.code] || "오류가 발생했습니다.";
          sb.textContent = "계정 만들기";
        });
    }, "dark", "lg");
    sb.style.width = "100%";
    w.appendChild(nf); w.appendChild(ef); w.appendChild(pf); w.appendChild(err); w.appendChild(sb);
    return w;
  }

  /* 회원 입장 ── Firestore 직접 인증 (Firebase Auth 미사용) */
  function buildMemberForm() {
    var w = div({});

    var infoBox = div({background:C.bbg, border:"1px solid #93c5fd", borderRadius:"10px", padding:"12px 14px", marginBottom:"16px"});
    infoBox.appendChild(p({fontSize:"13px", color:C.blue, fontWeight:"700", marginBottom:"4px"}, "💡 회원 로그인 방법"));
    infoBox.appendChild(p({fontSize:"12px", color:C.blue, lineHeight:"1.7"}, "트레이너에게 받은 이름과 비밀번호를 입력하세요."));
    w.appendChild(infoBox);

    var nf = mkField("이름 (등록된 이름)"); var ni = mkInput({type:"text", placeholder:"예) 김지수"}); nf.appendChild(ni);
    var pf = mkField("비밀번호"); var pi = mkInput({type:"password", placeholder:"트레이너에게 받은 비밀번호"}); pf.appendChild(pi);
    var err = p({color:C.red, fontSize:"13px", marginBottom:"12px", minHeight:"18px"}, "");
    var lb = mkBtn("입장하기", function() {
      var name = ni.value.trim();
      var pw = pi.value;
      if (!name || !pw) { err.textContent = "이름과 비밀번호를 모두 입력해주세요."; return; }
      err.textContent = "";
      lb.innerHTML = '<span class="sp">⟳</span> 확인 중...';

      /* Firestore에서 이름으로 회원 조회 → 비밀번호 대조 */
      db.collection("members").where("name","==",name).get()
        .then(function(snap) {
          if (snap.empty) {
            err.textContent = "등록된 이름이 없습니다. 트레이너에게 문의하세요.";
            lb.textContent = "입장하기";
            return;
          }
          var matched = null;
          snap.docs.forEach(function(doc) {
            if (doc.data().memberPassword === pw) matched = doc;
          });
          if (!matched) {
            err.textContent = "비밀번호가 올바르지 않습니다.";
            lb.textContent = "입장하기";
            return;
          }
          /* 로그인 성공 */
          APP.role = "member";
          APP.memberId = matched.id;
          APP.tab = "workout";
          document.querySelector(".ov") && document.querySelector(".ov").remove();
          loadMember(matched.id).then(function() { renderApp(); });
        })
        .catch(function(e) {
          err.textContent = "오류가 발생했습니다: " + e.message;
          lb.textContent = "입장하기";
        });
    }, "dark", "lg");
    lb.style.width = "100%";

    w.appendChild(nf); w.appendChild(pf); w.appendChild(err); w.appendChild(lb);
    return w;
  }

  refreshForm();
  mkModal("PT Manager Pro", cnt);
}

    var lf = mkField("링크 (선택)"); var li = mkInput({type:"url",placeholder:"https://..."}); lf.appendChild(li); cnt.appendChild(lf);
    var sb = mkBtn("배포하기", function() {
      if (!ti.value.trim()) { showToast("제목을 입력해주세요",false); return; }
      sb.innerHTML = '<span class="sp">⟳</span> 배포 중...';
      dbAdd("resources",{trainerId:getUid(), title:ti.value.trim(), category:cs.value, description:di.value, content:cta.value, link:li.value, date:todayStr()})
        .then(function(){ showToast("자료 배포 완료!"); document.querySelector(".ov") && document.querySelector(".ov").remove(); })
        .catch(function(){ showToast("오류가 발생했습니다",false); sb.textContent="배포하기"; });
    },"dark","lg"); sb.style.width = "100%";
    cnt.appendChild(sb);
    mkModal("자료 추가",cnt,true);
  }
  return wrap;
}

/* ══════════════════════════════
   앱 시작
══════════════════════════════ */
auth.onAuthStateChanged(function(user) {
  /* 회원은 Firestore 직접 인증 → Firebase Auth 상태 무시 */
  if (APP.role === "member") return;

  if (user) {
    db.collection("trainers").doc(user.uid).get()
      .then(function(snap) {
        if (snap.exists) {
          APP.role = "trainer";
          APP.tab = "dash";
          loadTrainer();
          renderApp();
        } else {
          /* 트레이너 컬렉션에 없으면 로그아웃 */
          auth.signOut().then(function(){ APP.role=null; renderApp(); });
        }
      })
      .catch(function() { APP.role=null; renderApp(); });
  } else {
    if (APP.role !== "member") {
      APP.role = null;
      renderApp();
    }
  }
});
</script>
